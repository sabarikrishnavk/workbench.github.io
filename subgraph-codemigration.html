<style>
  :root{
    --bg: #f6f7f9; --panel: #fff; --ink: #1f2933; --muted: #6b7280; --line: #e4e7eb;

<script>
/* ------------------------------ utils (ported from gql-migration.html) ---- */
function toast(msg){ const t=document.getElementById("toast"); if(!t) return; t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1400); }
// JSON string safe to embed inside a single-quoted HTML attribute (onclick).
function attrJson(s){ return JSON.stringify(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/'/g,"&#39;"); }
// Wrap whole-word occurrences of changed identifiers with a diff marker (used on esc'd code / SDL).
function markDiffs(s, tokens){
  if(!tokens || !tokens.size) return s;
  for(const t of [...tokens].filter(x=>x&&/^[A-Za-z_]\w*$/.test(x)).sort((a,b)=>b.length-a.length)){
    s=s.replace(new RegExp("\\b"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g"), '<mark class="diff">'+t+'</mark>');
  }
  return s;
}
function restRefOf(op){ return `${op.method||""} ${op.path||""}`.trim(); }
// The legacy REST endpoint(s) a registry op replaces: its "REST: GET /x" lines in Links & References.
function restRefsOf(reg){ return linkValues(reg&&reg.Links, "REST"); }
function refMatches(reg, restOp){ return !!restOp && restRefsOf(reg).includes(restRefOf(restOp)); }
function parseGqlParams(str){
  return stripDescriptions(str).split(/[,\n\r]+/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const i=s.indexOf(":"); return i<0 ? {name:s, type:"String"} : {name:s.slice(0,i).trim(), type:s.slice(i+1).trim()||"String"};
  });
}
// Parse a registry Schema.Definition body ('@key(fields:"id") {\n id: ID! ...}') back into a type object.
function parseDefBody(kind, name, def){
  def=String(def||""); const k=String(kind||"");
  const km=def.match(/@key\(fields:\s*"([^"]*)"/); const key=km?km[1]:"";
  // borrowed entity from another subgraph: Reference (stub) or Extend (field contribution)
  const extMode = k==="Reference" ? "reference" : (k==="Extend" ? "extend"
                : (/^extend\s+type/.test(def.trim()) ? "extend" : (/resolvable:\s*false/.test(def) ? "reference" : "")));
  const isEntity = k==="Key" || !!extMode || /@key/.test(def);
  const inner=stripDescriptions((def.match(/\{([\s\S]*)\}/)||[,""])[1]);
  const lines=inner.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).filter(s=>!s.startsWith("#"));
  if(kind==="Enum") return { name, kind:"enum", isEntity:false, key:"", fields:[], values:lines };
  // "name(args): Type @directive" → { name, args, type, external } (args/directives kept out of the type)
  const fields=lines.map(l=>{ const m=l.match(/^(\w+)\s*(\([^)]*\))?\s*:\s*([^@#=]+)(.*)$/); return m?{ name:m[1], args:(m[2]||"").slice(1,-1).trim(), type:m[3].trim(), external:/@external\b/.test(m[4]) }:null; }).filter(Boolean);
  const t={ name, kind:(kind==="Input"?"input":"type"), isEntity, key:key||(isEntity?keyOf(fields):""), fields, values:[] };
  if(extMode){ t.ext=extMode; if(extMode==="reference") t.external=true; }
  return t;
}

/* ---------------- OpenAPI → REST ops / types (ported) ------------------- */
function parseOpenAPI(text, sgName){
  let spec; text=String(text||"").trim();
  try{ spec = text.startsWith("{") ? JSON.parse(text) : jsyaml.load(text); }
  catch(e){ try{ spec = jsyaml.load(text); }catch(e2){ throw new Error("Could not parse spec as JSON or YAML"); } }
  const comps = (spec.components && spec.components.schemas) || spec.definitions || {};
  const inputNames=new Set();
  for(const pathOps of Object.values(spec.paths||{})){
    for(const op of Object.values(pathOps||{})){
      const rb=op && op.requestBody && op.requestBody.content && op.requestBody.content["application/json"] && op.requestBody.content["application/json"].schema;
      if(rb && rb.$ref) inputNames.add(refName(rb.$ref));
    }
  }
  const types=[]; const byName={};
  function addType(t){ if(!t.name) return null; if(byName[t.name]) return byName[t.name]; byName[t.name]=t; types.push(t); return t; }
  function resolveType(sch, fallback){
    if(!sch) return "String";
    if(sch.$ref){ return refName(sch.$ref); }
    if(Array.isArray(sch.enum)){ const nm=cap(fallback||"Enum"); addType({name:nm, kind:"enum", isEntity:false, key:"", fields:[], values:sch.enum.map(String)}); return nm; }
    if(sch.type==="array"){ return "["+resolveType(sch.items, fallback)+"]"; }
    if(sch.type==="object" || sch.properties){
      const nm=cap(fallback||"Object");
      const fields=objFields(sch, nm);
      const k=entityKey(nm, fields);
      addType({name:nm, kind:"type", isEntity:!!k, key:k, fields, values:[]});
      return nm;
    }
    return gqlScalar(sch.type);
  }
  function objFields(sch, ownerName){
    const props=sch.properties||{}; const req=new Set(sch.required||[]);
    return Object.entries(props).map(([k,v])=>{ let t=resolveType(v, ownerName+cap(k)); if(req.has(k)) t+="!"; return {name:k, type:t}; });
  }
  for(const [name, sch] of Object.entries(comps)){
    const nm=cap(slug(name).replace(/ /g,"")) || name;
    if(sch && Array.isArray(sch.enum)){ addType({name:nm, kind:"enum", isEntity:false, key:"", fields:[], values:sch.enum.map(String)}); continue; }
    const s=derefSchema(sch, comps);
    if(s.type==="object" || s.properties){
      const fields=objFields(s, nm);
      if(inputNames.has(nm)) addType({name:nm, kind:"input", isEntity:false, key:"", fields, values:[]});
      else { const k=entityKey(nm, fields); addType({name:nm, kind:"type", isEntity:!!k, key:k, fields, values:[]}); }
    } else if(Array.isArray(s.enum)){
      addType({name:nm, kind:"enum", isEntity:false, key:"", fields:[], values:s.enum.map(String)});
    } else {
      addType({name:nm, kind:"type", isEntity:false, key:"", fields:[{name:"value", type:(resolveType(s, nm+"Value")||"String")}], values:[]});
    }
  }
  const ops=[]; const paths=spec.paths||{};
  for(const [p, pathOps] of Object.entries(paths)){
    const shared = (pathOps && pathOps.parameters) || [];
    for(const [method, op] of Object.entries(pathOps||{})){
      if(!["get","post","put","patch","delete"].includes(String(method).toLowerCase())) continue;
      if(!op || typeof op!=="object") continue;
      const opName = op.operationId || (method+cap(slug(p)).replace(/ /g,""));
      const resp=(op.responses && (op.responses["200"]||op.responses["201"]||op.responses["2XX"]||op.responses.default))||{};
      const rsch=(resp.content && resp.content["application/json"] && resp.content["application/json"].schema) || resp.schema || null;
      const returns = rsch ? resolveType(rsch, opName+"Response") : "Boolean";
      const args=[];
      for(const pr of [...shared, ...(op.parameters||[])]){
        if(!pr || pr.$ref) continue;
        if(["path","query"].includes(pr.in) || pr.in==null){
          const t=(pr.schema?resolveType(pr.schema, opName+cap(pr.name||"Arg")):gqlScalar(pr.type))||"String";
          args.push({name:pr.name, type:t+(pr.required?"!":"")});
        }
      }
      const rb = op.requestBody && op.requestBody.content && op.requestBody.content["application/json"] && op.requestBody.content["application/json"].schema;
      if(rb){ const t=resolveType(rb, opName+"Input"); const it=byName[baseType(t)]; if(it && it.kind==="type"){ it.kind="input"; it.isEntity=false; it.key=""; } args.push({name:"input", type:t+(op.requestBody.required?"!":"")}); }
      const bt=baseType(returns);
      const entity = byName[bt] ? bt : "";
      ops.push({ id:uid(), name:opName, method:String(method).toUpperCase(), path:p,
        opKind: String(method).toLowerCase()==="get"?"query":"mutation",
        args, returns, entity, notes: op.summary||op.description||"" });
    }
  }
  return { id:uid(), name:sgName, spec:"", ops, types };
}

/* ---------------- sample payloads / client generators (ported) ---------- */
function sampleForType(type, sg, depth){
  depth=depth||0; const isList=/^\s*\[/.test(String(type||""));
  const bt=baseType(type), named=(sg.types||[]).find(t=>t.name===bt);
  let one;
  if(named && named.kind==="enum"){ one=(named.values||[])[0]||"VALUE"; }
  else if(named && depth<2){ one={}; for(const f of (named.fields||[])) one[f.name]=sampleForType(f.type, sg, depth+1); }
  else { const b=bt.toLowerCase();
    if(b==="int"||b==="integer"||b==="long") one=42;
    else if(b==="float"||b==="double"||b==="number"||b==="bigdecimal") one=42.5;
    else if(b==="boolean"||b==="bool") one=true;
    else if(b==="id") one="id-123";
    else one="sample"; }
  return isList ? [one] : one;
}
// Selection set for type t. Fields with required arguments are skipped; nested objects past the depth
// limit select just their key (or first scalar) so the document stays valid. `acc`, when given, collects
// the entity types whose fields are selected (for the router fan-out in the sequence trace).
function gqlSelection(t, sg, indent, depth, acc){
  indent=indent||"  "; depth=depth||0;
  const lines=[];
  for(const f of ((t&&t.fields)||[])){
    if(f.external || /!/.test(f.args||"")) continue;
    const bt=baseType(f.type), named=(sg.types||[]).find(x=>x.name===bt && !x.ext);
    if(named && named.kind!=="enum" && (named.fields||[]).length){       // object type (scalars/enums have no fields)
      if(depth<2){
        if(acc && named.isEntity) acc.push({ type:named.name, key:named.key, fields:(named.fields||[]).filter(x=>!x.external&&!/!/.test(x.args||"")).map(x=>x.name) });
        lines.push(indent+f.name+" {"); lines.push(gqlSelection(named, sg, indent+"  ", depth+1, acc)); lines.push(indent+"}");
      } else {
        const leaf=named.key ? named.key.split(/[\s,]+/)[0] : ((named.fields||[]).find(x=>!(sg.types||[]).some(y=>y.name===baseType(x.type)&&(y.fields||[]).length))||{}).name;
        if(leaf) lines.push(indent+f.name+" { "+leaf+" }");
      }
    } else lines.push(indent+f.name);
  }
  return lines.join("\n");
}
function opPayloads(op, sg, ent){
  const varDefs=(op.args||[]).map(a=>`$${a.name}: ${a.type}`).join(", ");
  const fieldArgs=(op.args||[]).map(a=>`${a.name}: $${a.name}`).join(", ");
  const variables={}; for(const a of (op.args||[])){ variables[a.name]=sampleForType(a.type, sg, 1); }
  const sel=gqlSelection(ent, sg, "    ");
  const kw=op.opKind==="mutation"?"mutation":"query";
  const opTitle=cap(op.name);
  const gqlDoc=`${kw} ${opTitle}${varDefs?`(${varDefs})`:""} {\n  ${op.name}${fieldArgs?`(${fieldArgs})`:""} {\n${sel}\n  }\n}`;
  const dataObj={}; dataObj[op.name]= /^\s*\[/.test(String(op.returns||"")) ? [sampleForType(ent.name, sg, 1)] : sampleForType(ent.name, sg, 1);
  const restBody=op.opKind==="mutation" ? sampleForType(ent.name, sg, 1) : null;
  return { varDefs, fieldArgs, variables, gqlDoc, gqlResponse:{ data:dataObj }, restResponse:sampleForType(ent.name, sg, 1), restBody };
}
function javaMap(obj){ const e=Object.entries(obj); if(!e.length) return "Map.of()"; return "Map.of("+e.map(([k,v])=>`"${k}", ${typeof v==="string"?`"${v}"`:v}`).join(", ")+")"; }
const CODE_LANGS={
  "JavaScript": (op,p,ctx)=>({
    rest:`// Current — REST (${op.method} ${op.path})\nconst res = await fetch(\`\${BASE}${(op.path||"").replace(/\{(\w+)\}/g,(m,k)=>"${"+k+"}")}\`${op.opKind==="mutation"?`, {\n  method: "${op.method}",\n  headers: { "Content-Type": "application/json" },\n  body: JSON.stringify(payload)\n}`:""});\nconst ${ctx.varName} = await res.json();`,
    gql:`// Target — FedGQL\nconst query = \`\n${p.gqlDoc}\`;\nconst res = await fetch(GRAPHQL_URL, {\n  method: "POST",\n  headers: { "Content-Type": "application/json" },\n  body: JSON.stringify({ query, variables: ${JSON.stringify(p.variables)} })\n});\nconst { data } = await res.json();\nconst ${ctx.varName} = data.${op.name};`
  }),
  "Java": (op,p,ctx)=>({
    rest:`// Current — REST (${op.method} ${op.path})\nHttpRequest req = HttpRequest.newBuilder()\n    .uri(URI.create(BASE + "${op.path}"))\n    ${op.opKind==="mutation"?`.header("Content-Type","application/json")\n    .${op.method}(BodyPublishers.ofString(mapper.writeValueAsString(payload)))`:".GET()"}\n    .build();\nHttpResponse<String> res = client.send(req, BodyHandlers.ofString());\n${cap(ctx.entity)} ${ctx.varName} = mapper.readValue(res.body(), ${cap(ctx.entity)}.class);`,
    gql:`// Target — FedGQL\nString query = "${p.gqlDoc.replace(/\n/g,"\\n").replace(/"/g,'\\"')}";\nMap<String,Object> body = Map.of("query", query, "variables", ${javaMap(p.variables)});\nHttpRequest req = HttpRequest.newBuilder()\n    .uri(URI.create(GRAPHQL_URL))\n    .header("Content-Type","application/json")\n    .POST(BodyPublishers.ofString(mapper.writeValueAsString(body)))\n    .build();\nHttpResponse<String> res = client.send(req, BodyHandlers.ofString());\n// res.body(): { "data": { "${op.name}": { ... } } }`
  }),
  "Android (Kotlin)": (op,p,ctx)=>({

function pathParams(path){ return [...String(path||"").matchAll(/\{(\w+)\}/g)].map(m=>m[1]); }
function sdlForType(t){
  if(!t) return "";

  const body=(t.fields||[]).map(f=>`  ${f.name}: ${f.type}`).join("\n");
  if(t.kind==="input") return `input ${t.name} {\n${body}\n}`;
  if(t.isEntity) return `type ${t.name} @key(fields: "${t.key||keyOf(t.fields)}") {\n${body}\n}`;

/* ---------- Server: a federation SUBGRAPH implementing the registry's Query / Mutation ops ----------

     • the service layer — one method per op (orchestrating mutations get the BFF's downstream calls),
     • the REST API — the current controller actions, bound by each op's "REST:" link, calling the service,
     • Query + Mutation resolvers for every op of the subgraph (the selected op is marked), calling the
       same service, plus entity reference resolvers for the @key types it owns and resolvers for fields

const DESC3=/"""([\s\S]*?)"""/;
function subgraphModel(entityId){
  const sgName=subgraphOf(entityId);

  if(!entIds.size) entIds.add(String(entityId||""));
  const rows=(M.reg.Schema||[]).filter(r=>entIds.has(String(r.EntityID||"")) && r.Kind!=="Scalar");
  const types=rows.map(r=>({ row:r, kind:r.Kind, name:String(r.TypeName||"").trim(), t:parseDefBody(r.Kind, r.TypeName, r.Definition) })).filter(x=>x.name);
  const ops=M.gqlOps.filter(o=>entIds.has(String(o.EntityID||""))).map(o=>({ ...o, args:parseGqlParams(o.Parameters), rest:restBinding(o) }));
  const st=serviceTypeOf(sgName);
  return { sgName, entIds, types, ops, Sg:cap(sgName.replace(/[^A-Za-z0-9]+(.)?/g,(m,c)=>c?c.toUpperCase():"")) || "Subgraph", svcType:st.type, svcTypeSrc:st.src };

/* Service Type (GQL registry · Entities.ServiceType, per Business Application) decides how the

     Orchestrator — coordinates other subgraph services over REST / gRPC; the only type that may.

const SERVICE_TYPES=["Domain","Integration","Orchestrator"];

function serviceTypeOf(sgName){

const svcTypeOfEntity=eid=>serviceTypeOf(subgraphOf(eid));
const svcTypeBadge=st=>`<span class="stype ${st.type.toLowerCase()}">${st.type}</span>${st.src==="inferred"?' <span class="hint">(inferred — set Service Type in the GQL registry)</span>':""} <span class="hint">· ${esc(SERVICE_RULES[st.type])}</span>`;

const isInputType=t=>M.regTypes.some(x=>x.name===baseType(t) && x.kind==="input");

  const body= ["POST","PUT","PATCH"].includes(b.method) ? (inArg ? inArg.name : (rest.length ? "{ "+rest.map(a=>a.name).join(", ")+" }" : null)) : null;

function regDescOf(op){ const r=(op.kind==="mutation"?(M.reg.Mutations||[]):(M.reg.Queries||[])).find(x=>x.Name===op.Name && String(x.EntityID||"")===String(op.EntityID||"")); return (r&&r.Description)||""; }
// Subgraph SDL — owned types with their descriptions, borrowed entities as @key stubs, then the roots.
function subgraphSDL(sg){
  const used=new Set(["@key"]), blocks=[];
  for(const x of sg.types){
    const def=String(x.row.Definition||"").trim(), doc=x.row.Description?descLine(x.row.Description)+"\n":"";
    if(/@external/.test(def)) used.add("@external"); if(/@requires/.test(def)) used.add("@requires"); if(/@shareable/.test(def)) used.add("@shareable");
    if(x.kind==="Enum"){ const vals=def.replace(/^[^{]*\{|\}\s*$/g,"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean); blocks.push(`${doc}enum ${x.name} {\n${vals.map(v=>"  "+v).join("\n")}\n}`); continue; }
    const kw=x.kind==="Input"?"input":x.kind==="Interface"?"interface":"type";
    const bi=def.indexOf("{"), head=bi>=0?def.slice(0,bi).trim():def, body=bi>=0?def.slice(bi):"{\n}";
    const tag=x.kind==="Extend"?"# contributes fields to an entity owned by another subgraph\n":x.kind==="Reference"?"# reference stub — owned by another subgraph\n":"";
    blocks.push(`${tag}${doc}${kw} ${x.name}${head?" "+head:""} ${body}`);
  }
  const root=(kind, title)=>{ const list=sg.ops.filter(o=>o.kind===kind); if(!list.length) return null;
    return `type ${title} {\n${list.map(o=>{ const ps=describedLines(o.Parameters,true), d=regDescOf(o); const anyDesc=ps.some(p=>p.desc);
      const args=!ps.length?"":anyDesc?"(\n"+ps.map(p=>(p.desc?"    "+descLine(p.desc)+"\n":"")+"    "+p.line).join("\n")+"\n  )":"("+ps.map(p=>p.line).join(", ")+")";
      return (d?"  "+descLine(d)+"\n":"")+`  ${o.Name}${args}: ${o.ReturnType||"Boolean"}`; }).join("\n")}\n}`; };

// Custom scalars (registry Scalar rows, e.g. Money) used by the subgraph's types and ops.
function customScalars(sg){

// Reference resolver for an owned @key type: the subgraph query returning it whose args are the key fields.
function lookupQueryFor(sg, typeName, keyFields, extraArgs){
  const allowed=new Set([...(keyFields||[]), ...(extraArgs||[])]);
  return sg.ops.find(o=>o.kind==="query" && baseType(o.ReturnType)===typeName && !/^\s*\[/.test(o.ReturnType||"") && o.args.length && o.args.every(a=>allowed.has(a.name))) || null;

const keyList=t=>String(t.key||"").split(/[\s,]+/).filter(Boolean);

  const out=[];

    const keys=keyList(x.t);

const MARK=(op, sel)=>op.id===sel.id ? "   // ← selected op" : "";
const restLabel=op=>op.rest?`${op.rest.method} ${op.rest.path}`:"no REST link — add a REST: line in Links & References";

const sgPascal=s=>cap(String(s||"").replace(/[^A-Za-z0-9]+(.)?/g,(m,c)=>c?c.toUpperCase():""))||"Svc";
const isWriteM=m=>["POST","PUT","PATCH"].includes(m);
const inputFieldDefs=t=>((M.regTypes.find(x=>x.name===baseType(t) && x.kind==="input")||{}).fields||[]);
const isListT=t=>/^\s*\[/.test(String(t||""));

// How each GraphQL arg is read from the REST request the current controller receives.
function restIn(o){
  const b=o.rest; if(!b) return null;

/* --- orchestration: the BFF mapping whose orchestrator is this op, and its downstream steps --- */
function orchestrationOf(opId, preferRef){
  const sgReg={ name:M.sgName||"registry", types:M.regTypes };
  const entries=Object.entries(M.bff||{}).sort(([a],[b])=>(a===preferRef?-1:b===preferRef?1:0));
  for(const [ref,m] of entries){
    if(!m.orchestrator || String(m.orchestrator)!==String(opId)) continue;
    const self=(m.ops||[]).find(o=>String(o.opId)===String(opId)); if(!self) continue;
    const selfSg=subgraphOf(self.entityId);

      const via= sg===selfSg ? "local" : (o.via==="grpc"||!rest ? "grpc" : "rest");

const stepLabel=st=> st.via==="local" ? `${st.model.name} — in-process (same subgraph)`

  for(const x of orchArgs) if(isInputType(x.type) && inputFields(x.type).includes(name)) return { arg:x.name, field:name };

// a step's gRPC request: every arg flattened to scalar leaves (input objects expanded)

const snake=s=>String(s).replace(/([a-z0-9])([A-Z])/g,"$1_$2").toLowerCase();

// What the service method for an op implements, given the subgraph's Service Type.

const misplacedNote=(sg,p)=>`${sg.sgName} is a ${sg.svcType} service (${SERVICE_RULES[sg.svcType]}), but ${p.orch.ref} makes this op orchestrate ${p.orch.steps.length} call(s). Set Service Type = Orchestrator for ${sg.sgName} in the GQL registry, or pick an op of an Orchestrator subgraph.`;

  files.push({ title:"Program.cs — one service: REST API + GraphQL API (subgraph)", code:`var builder = WebApplication.CreateBuilder(args);\n\nbuilder.Services.AddScoped<${S}>();   // shared by the REST controller and the GraphQL resolvers\nbuilder.Services.AddControllers();     // REST API — existing clients keep working\n${ext?`builder.Services.AddHttpClient("${sg.sgName}-external", c => c.BaseAddress = new Uri(builder.Configuration["External:${sgPascal(sg.sgName)}"]!));   // the system ${sg.sgName} integrates\n`:""}${rt.map(st=>`builder.Services.AddHttpClient("${st.sg}-rest", c => c.BaseAddress = new Uri(builder.Configuration["Rest:${sgPascal(st.sg)}"]!));   // ${st.sg} service (REST)\n`).join("")}${gt.map(st=>`builder.Services.AddGrpcClient<${st.Sg}.Grpc.${st.Sg}Service.${st.Sg}ServiceClient>(o => o.Address = new Uri(builder.Configuration["Grpc:${sgPascal(st.sg)}"]!));   // ${st.sg} service (gRPC)\n`).join("")}\nbuilder.Services\n    .AddGraphQLServer()         // GraphQL API — the router calls /graphql\n    .AddApolloFederation()      // _service / _entities, [Key], [ReferenceResolver]\n${[...customScalars(sg)].filter(n=>CS_DECIMAL_SCALARS.includes(n)).map(n=>`    .AddType(new DecimalType("${n}"))   // custom scalar ${n} (decimal at runtime)\n`).join("")}    .Add${sg.Sg}Types();     // source-generated (HotChocolate.Types.Analyzers) from [QueryType] / [MutationType] / records\n\nvar app = builder.Build();\napp.MapControllers();\napp.MapGraphQL();\napp.Run();` });

/* ----------------------------- Load example ------------------------------

   opens BFF composite mode on the orchestrated checkout; a subgraph spec opens single-op mode.
   Needs http(s) — browsers block fetch on file://. */
async function loadExample(which){
  const bff=which==="bff", specPath=bff ? "samples/bff-openapi.yaml" : `samples/subgraph/${which}/openapi.yaml`;
  let reg, spec;
  try{
    const get=async (u,bin)=>{ const res=await fetch(u); if(!res.ok) throw new Error(u+" — HTTP "+res.status); return bin?res.arrayBuffer():res.text(); };
    [reg, spec]=await Promise.all([get("samples/GQLRegistry-sample.xlsx",true), get(specPath,false)]);
  }catch(e){
    alert("Couldn't load the example files ("+(e.message||e)+").\n\nLoad example needs the pages served over http(s) — e.g. GitHub Pages, or run  python3 -m http.server  in this folder. When opened from disk (file://), pick samples/GQLRegistry-sample.xlsx and a samples/ spec with the Choose… buttons instead.");
    return;
  }
  M.bff={}; loadRegWB(XLSX.read(reg,{type:"array"})); M.sgName="GQLRegistry-sample";
  const sg=parseOpenAPI(spec, specPath); M.restOps=sg.ops; M.restTypes=sg.types; M.restName=specPath.split("/").slice(-2).join("/");
  selEntity=""; selRest=""; selGql=""; openMenu=false;
  if(bff){ mode="bff"; bffRef="POST /bff/checkout"; }
  else { mode="single"; const own=(M.entities||[]).find(e=>String(e.BusinessApplication||"").trim()===which); selEntity=own?String(own.EntityID):""; }
  renderStatus(); render();
  toast(bff ? "Loaded the example — BFF composite · POST /bff/checkout" : `Loaded the example — ${which} REST spec (single op)`);
}
async function tryAutoFetch(){

// Build the code-gen op from a GraphQL registry row + a REST endpoint, plus the REST→FedGQL diff.
// Shared by Single-op render() and each BFF op's mapping table.
function buildOpCtx(gqlSel, restSel, sgReg){
  const gqlOp={ name:gqlSel.Name, opKind:gqlSel.kind, method:restSel.method, path:restSel.path,
    args:parseGqlParams(gqlSel.Parameters), returns:gqlSel.ReturnType||restSel.returns||"Boolean" };
  const retEnt=M.regTypes.find(t=>t.name===baseType(gqlOp.returns)) || { name:baseType(gqlOp.returns)||"Result", kind:"type", isEntity:false, key:"", fields:[], values:[] };
  const origRet=M.restTypes.find(t=>t.name===baseType(restSel.returns)) || retEnt;
  const varName=retEnt.name.charAt(0).toLowerCase()+retEnt.name.slice(1);
  const p=opPayloads(gqlOp, sgReg, retEnt);
  const restReqLine=restRefOf(restSel);
  const matched=refMatches(gqlSel, restSel);

  const of=origRet.fields||[], nf=retEnt.fields||[], nField=Math.max(of.length, nf.length);
  const ra=restSel.args||[], ga=gqlOp.args||[], nParam=Math.max(ra.length, ga.length);
  const diffTokens=new Set(), changes=[];
  if(restSel.name && restSel.name!==gqlOp.name){ changes.push({label:"Operation", from:restSel.name, to:gqlOp.name}); diffTokens.add(gqlOp.name); }
  if(baseType(restSel.returns) && baseType(restSel.returns)!==baseType(gqlOp.returns)){ changes.push({label:"Return type", from:restSel.returns, to:gqlOp.returns}); diffTokens.add(baseType(gqlOp.returns)); }
  for(let i=0;i<nParam;i++){ const a=ra[i], b=ga[i];
    if(a&&b&&(a.name!==b.name||baseType(a.type)!==baseType(b.type))){ changes.push({label:"Argument", from:`${a.name}: ${a.type}`, to:`${b.name}: ${b.type}`}); if(a.name!==b.name) diffTokens.add(b.name); if(baseType(a.type)!==baseType(b.type)) diffTokens.add(baseType(b.type)); }
    else if(b&&!a){ changes.push({label:"Argument", from:"—", to:`${b.name}: ${b.type}`}); diffTokens.add(b.name); } }
  const fieldRows=[];
  for(let i=0;i<nField;i++){
    const o=of[i], n=nf[i];
    const nameCh=o&&n&&o.name!==n.name, typeCh=o&&n&&baseType(o.type)!==baseType(n.type);
    if(nameCh) diffTokens.add(n.name); if(typeCh) diffTokens.add(baseType(n.type));
    let tag='<span class="hint">—</span>', rowcls="";
    if(o&&n&&(nameCh||typeCh)){ tag=`<span class="chg">${[nameCh?"renamed":"",typeCh?"retyped":""].filter(Boolean).join(" · ")}</span>`; rowcls=" class=\"rowchg\""; }
    else if(n&&!o){ tag='<span class="chg">added</span>'; rowcls=" class=\"rowchg\""; }
    else if(o&&!n){ tag='<span class="chg">removed</span>'; rowcls=" class=\"rowchg\""; }
    const restCell=o?`${o.name}: ${o.type}`:"—";
    const gqlCellRaw=n?`${n.name}: ${n.type}`:"—";
    const gqlCell=(nameCh||typeCh)&&n ? markDiffs(esc(gqlCellRaw), new Set([n.name, baseType(n.type)])) : esc(gqlCellRaw);
    fieldRows.push(`<tr${rowcls}><td class="mono">${esc(restCell)}</td><td class="mono">${gqlCell}</td><td>${tag}</td></tr>`);
  }
  const fieldRowsHtml=fieldRows.join("") || `<tr><td colspan="3" class="empty">no fields</td></tr>`;
  const changesHtml = changes.length
    ? `<ul class="chglist">${changes.map(ch=>`<li><b>${esc(ch.label)}:</b> <span class="mono">${esc(ch.from)}</span> → <span class="mono">${markDiffs(esc(ch.to), diffTokens)}</span></li>`).join("")}</ul>`
    : `<p class="hint" style="margin:2px 0 10px">No name/type changes between the REST source and the FedGQL target.</p>`;
  const mapNote = matched
    ? '<span class="hint">(matched by REST reference)</span>'
    : `<span class="hint" style="color:#b45309">(manual cross-map — this GraphQL op's REST reference is ${esc(restRefsOf(gqlSel).join(", ")||"—")})</span>`;
  return { gqlOp, retEnt, origRet, varName, p, restReqLine, matched, diffTokens, changes, fieldRows, changesHtml, fieldRowsHtml, mapNote };
}

  const cx=buildOpCtx(gqlSel, restSel, sgReg);

  const seqSrc=opSequenceMermaid(gqlSel, cx, sgReg);

  // Generated code section (client or server).
  let codeSection;
  if(outKind==="Server"){
    // A federation subgraph implementing the registry ops of the selected op's subgraph.
    const sgm=subgraphModel(gqlSel.EntityID), gen=SUBGRAPH_SERVERS[lang]||SUBGRAPH_SERVERS["Node.js (Apollo Server)"];
    const files=gen(sgm, gqlSel);
    const nQ=sgm.ops.filter(o=>o.kind==="query").length, nM=sgm.ops.filter(o=>o.kind==="mutation").length, unbound=sgm.ops.filter(o=>!o.rest).map(o=>o.Name);
    const P=SERVER_PAIRS[lang]||SERVER_PAIRS["Node.js (Apollo Server)"];

    codeSection = `<div class="code-head"><h3>${esc(lang)} — <span class="mono">${esc(sgm.sgName)}</span> subgraph · ${nQ} ${nQ===1?"query":"queries"} · ${nM} ${nM===1?"mutation":"mutations"} <span class="hint">(one service hosting the REST API + the GraphQL API · <span class="mono">${esc(gqlOp.name)}</span> marked “← selected op”)</span></h3></div>
      <p style="margin:2px 0 8px;font-size:13px"><b>Service Type</b> ${svcTypeBadge({ type:sgm.svcType, src:sgm.svcTypeSrc })}</p>
      ${unbound.length?`<p class="hint" style="color:#b45309;margin:0 0 6px">No REST: link for ${unbound.map(n=>`<span class="mono">${esc(n)}</span>`).join(", ")} — add one in Links &amp; References (registry) to generate its REST call.</p>`:""}
      <div class="kv">REST API ↔ GraphQL API <span class="hint">(the current controller action, kept, next to the resolver added beside it — both call the shared service method below them)</span></div>
      ${selOp?opPairHtml(sgm, selOp, gqlSel, P):""}
      ${others.length?`<details class="stdref" style="margin:6px 0 12px"><summary><b>Other ops in the ${esc(sgm.sgName)} subgraph</b> <span class="hint">· ${others.length} REST ↔ GraphQL pair${others.length===1?"":"s"}</span></summary>${others.map(o=>opPairHtml(sgm, o, gqlSel, P)).join("")}</details>`:""}
      <div class="kv">Generated subgraph files</div>

/* --- persistence: localStorage cache + BffMappings sheet round-trip --- */
function saveBff(){ try{ localStorage.setItem(BFF_LS, JSON.stringify(M.bff)); }catch(e){} }
function loadBff(){ try{ const s=localStorage.getItem(BFF_LS); if(s) M.bff=JSON.parse(s)||{}; }catch(e){ M.bff={}; } }
function hydrateBff(rows){  // rows from the BffMappings sheet -> M.bff (registry wins)
  const bff={};
  for(const r of rows||[]){
    const ref=r.BffRef; if(!ref) continue;
    const m=bff[ref]||(bff[ref]={ name:r.BffName||"", ops:[], owner:"" });
    if(!m.name && r.BffName) m.name=r.BffName;
    const opId=String(r.GqlOpId||"");
    m.ops.push({ alias:r.Alias||r.GqlOp||"", kind:(r.GqlKind||"query"), name:r.GqlOp||"",
      opId, entityId:String(r.EntityID||""), args:r.Args||"", notes:r.Notes||"",
      via:String(r.Via||"").trim().toLowerCase()==="grpc"?"grpc":"rest" });   // subgraph → subgraph: REST or gRPC, never GraphQL
    const role=String(r.Owner||"").trim().toLowerCase();
    if(role==="orchestrator") m.orchestrator=opId;            // orchestrating mutation (saga)
    else if(role) m.owner=opId;                               // owning op for federation composition
  }
  if(Object.keys(bff).length){ M.bff=bff; saveBff(); }
}
function bffRowsAoA(){
  const header=["BffRef","BffName","Alias","GqlKind","GqlOp","GqlOpId","EntityID","Args","Order","Notes","Owner","Via"];
  const rows=[header];

    (m.ops||[]).forEach((o,i)=>rows.push([ref, m.name||"", o.alias||"", o.kind||"", o.name||"", o.opId||"", o.entityId||"", o.args||"", i+1, o.notes||"", (m.orchestrator&&String(m.orchestrator)===String(o.opId))?"orchestrator":((m.owner&&String(m.owner)===String(o.opId))?"owner":""), o.via==="grpc"?"grpc":"rest"]));
  return rows;
}

function defaultBffName(){ const op=M.restOps.find(o=>restRefOf(o)===bffRef); return op?(cap(slug(op.name).replace(/ /g,""))||"Bff"):"Bff"; }
function curBff(){ if(!bffRef) return null; return M.bff[bffRef] || (M.bff[bffRef]={ name:defaultBffName(), ops:[] }); }
function setBffRef(v){ bffRef=v; openMenu=false; render(); }

// The owning op for federation: the explicit choice when it still points at a query op in the set,
// else the first query-kind op (the entry that resolves the base @key entity).
function bffOwnerOp(m){
  if(!m||!m.ops.length) return null;
  const q=m.ops.filter(o=>o.kind==="query"); if(!q.length) return null;
  return q.find(o=>String(o.opId)===String(m.owner||"")) || q[0];
}
function addBffOp(opId){
  const m=curBff(), o=M.gqlOps.find(g=>String(g.id)===String(opId)); if(!m||!o) return;
  m.ops.push({ alias:o.Name, kind:o.kind, name:o.Name, opId:String(o.id), entityId:String(o.EntityID||""), args:o.Parameters||"", notes:"", via:"rest" });
  if(!m.owner && o.kind==="query") m.owner=String(o.id);      // default owner = first query added
  openMenu=false; saveBff(); render();
}
function removeBffOp(idx){ const m=curBff(); if(m){ const rm=m.ops[idx]; m.ops.splice(idx,1); if(rm&&String(m.owner)===String(rm.opId)) m.owner=""; if(rm&&String(m.orchestrator)===String(rm.opId)) m.orchestrator=""; saveBff(); render(); } }

/* --- compose the aliased query / mutation documents --- */
function bffOpModel(o, sgReg){
  const reg=M.gqlOps.find(g=>String(g.id)===String(o.opId));
  const args=parseGqlParams(o.args!=null&&o.args!==""?o.args:(reg?reg.Parameters:""));
  const returns=reg?reg.ReturnType:"";
  const retEnt=M.regTypes.find(t=>t.name===baseType(returns));
  const prefix=String(o.alias||o.name||"op").replace(/[^A-Za-z0-9_]/g,"_");
  const varDefs=args.map(a=>`$${prefix}_${a.name}: ${a.type}`);
  const fieldArgs=args.map(a=>`${a.name}: $${prefix}_${a.name}`).join(", ");
  const sel=retEnt&&(retEnt.fields||[]).length ? gqlSelection(retEnt, sgReg, "      ") : "";
  const head=`    ${o.alias||o.name}: ${o.name}${fieldArgs?`(${fieldArgs})`:""}`;
  const field=sel ? `${head} {\n${sel}\n    }` : head;
  return { alias:o.alias||o.name, name:o.name, kind:o.kind, entityId:o.entityId, args, returns, retEnt, prefix, varDefs, fieldArgs, field };
}
function bffComposeDoc(bff, sgReg){
  const models=(bff.ops||[]).map(o=>bffOpModel(o, sgReg));
  const build=(kind, kw)=>{
    const list=models.filter(m=>m.kind===kind); if(!list.length) return null;
    const vars=[...new Set([].concat(...list.map(m=>m.varDefs)))];
    const doc=`${kw} ${bff.name||"Bff"}${vars.length?`(${vars.join(", ")})`:""} {\n${list.map(m=>m.field).join("\n")}\n}`;
    return { doc, vars, ops:list };
  };
  return { query:build("query","query"), mutation:build("mutation","mutation"), models };
}
function bffVarsSample(comp, sgReg){
  const v={};
  for(const part of [comp.query, comp.mutation]) if(part) for(const m of part.ops) for(const a of m.args) v[`${m.prefix}_${a.name}`]=sampleForType(a.type, sgReg, 1);
  return v;
}
function bffAliases(comp){ return [].concat(comp.query?comp.query.ops:[], comp.mutation?comp.mutation.ops:[]).map(o=>o.alias); }
const jStr=s=>String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g,"\\n");   // Java/C# string literal
const tStr=s=>String(s).replace(/\\/g,"\\\\").replace(/`/g,"\\`").replace(/\$\{/g,"\\${"); // JS template literal

// The field a subgraph contributes to entity `typeName` (registry Extend row) whose type matches `returns`.
function contributedField(typeName, entityId, returns){
  const row=(M.reg.Schema||[]).find(r=>r.Kind==="Extend" && r.TypeName===typeName && String(r.EntityID||"")===String(entityId||""));
  if(!row) return null;
  const fields=parseDefBody(row.Kind, row.TypeName, row.Definition).fields.filter(f=>!f.external);
  const rt=baseType(returns);
  return fields.find(f=>baseType(f.type)===rt && !/^\s*\[/.test(f.type)) || fields.find(f=>baseType(f.type)===rt) || null;
}
/* --- GraphQL-federation composition: one subgraph owns the @key entity, the others extend it ---
   The router resolves the base entity from the owning op, then fans out to each extending subgraph
   via _entities/reference-resolvers keyed by @key, and merges the contributed fields. The client
   query is therefore ONE nested selection (not flat siblings) — the router federates it. */
function bffFederation(bff, sgReg){
  const owner=bffOwnerOp(bff);
  if(!owner) return { ok:false, note:"Federation needs at least one query op to own the entity graph — add a query op, then pick it as the owning op." };
  const ownerModel=bffOpModel(owner, sgReg);
  const E=ownerModel.retEnt;
  if(!E) return { ok:false, note:`The owning op “${owner.alias||owner.name}” returns “${ownerModel.returns||"?"}”, which isn’t a registry entity type — federation needs an owning entity with a @key.` };
  const K=E.key||keyOf(E.fields)||"id";
  const keyType=((E.fields||[]).find(f=>f.name===K)||{}).type||"ID!";
  // every OTHER query op contributes an extension field on the owned entity (mutations stay flat).
  // When the registry has that subgraph's Extend row on the entity (e.g. pnp: Product.storeContext(storeId)),
  // use the real contributed field + its args; otherwise the op's alias stands in for the field.
  const extensions=(bff.ops||[])
    .filter(o=>o.kind==="query" && String(o.opId)!==String(owner.opId))
    .map(o=>{ const em=bffOpModel(o, sgReg), cf=contributedField(E.name, o.entityId, em.returns);
      if(!cf) return { op:o, model:em, retEnt:em.retEnt, fieldName:em.alias, fieldType:em.returns, args:em.args, prefix:em.prefix, fieldArgs:em.fieldArgs, varDefs:em.varDefs, alias:"" };
      const args=parseGqlParams(cf.args);
      return { op:o, model:em, retEnt:em.retEnt, fieldName:cf.name, fieldType:cf.type, args, prefix:em.prefix,
        fieldArgs:args.map(a=>`${a.name}: $${em.prefix}_${a.name}`).join(", "), varDefs:args.map(a=>`$${em.prefix}_${a.name}: ${a.type}`),
        alias:(o.alias && o.alias!==o.name && o.alias!==cf.name) ? o.alias : "" }; });

  // --- single nested federated query (router resolves base entity, then the extension fields) ---
  const varDefs=[...new Set([].concat(ownerModel.varDefs, ...extensions.map(x=>x.varDefs)))];
  const ownerSel=gqlSelection(E, sgReg, "      ");                       // owner entity fields (incl. the @key)
  const extBlocks=extensions.map(x=>{
    const inner=x.retEnt && (x.retEnt.fields||[]).length ? "\n"+gqlSelection(x.retEnt, sgReg, "        ")+"\n      " : " ";
    return `      ${x.alias?x.alias+": ":""}${x.fieldName}${x.fieldArgs?`(${x.fieldArgs})`:""} {${inner}}`;
  }).join("\n");
  const inner=[ownerSel, extBlocks].filter(s=>s&&s.trim()).join("\n");
  const query=`query ${bff.name||"Bff"}${varDefs.length?`(${varDefs.join(", ")})`:""} {\n    ${owner.alias||owner.name}${ownerModel.fieldArgs?`(${ownerModel.fieldArgs})`:""} {\n${inner}\n    }\n}`;

  // --- per-subgraph SDL: owning @key type + each extending subgraph's `extend … @key` ---
  const sdl=[];
  const ownerArgsSDL=ownerModel.args.length?`(${ownerModel.args.map(a=>`${a.name}: ${a.type}`).join(", ")})`:"";
  sdl.push({ entityId:owner.entityId, label:`Owning subgraph — ${owner.entityId||"(entity)"} · owns ${E.name}`,
    sdl:`${sdlForType(E)}\n\ntype Query {\n  ${owner.name}${ownerArgsSDL}: ${ownerModel.returns}\n}` });
  for(const x of extensions){
    const argsSDL=x.args.length?`(${x.args.map(a=>`${a.name}: ${a.type}`).join(", ")})`:"";
    let block=`extend type ${E.name} @key(fields: "${K}") {\n  ${K}: ${keyType} @external\n  ${x.fieldName}${argsSDL}: ${x.fieldType}\n}`;
    if(x.retEnt && (x.retEnt.fields||[]).length && x.retEnt.name!==E.name) block+="\n\n"+sdlForType(x.retEnt);
    sdl.push({ entityId:x.op.entityId, label:`Extending subgraph — ${x.op.entityId||"(entity)"} · extends ${E.name}`, sdl:block });
  }

  const vars={};
  for(const a of ownerModel.args) vars[`${ownerModel.prefix}_${a.name}`]=sampleForType(a.type, sgReg, 1);
  for(const x of extensions) for(const a of x.args) vars[`${x.prefix}_${a.name}`]=sampleForType(a.type, sgReg, 1);

  return { ok:true, owner:ownerModel, ownerOp:owner, entity:E, key:K, keyType, extensions, query, sdl, vars };
}

/* --- Mermaid SEQUENCE (trace) diagram: how the FedGQL router wires responses across subgraphs
   via @key. The router resolves the base entity from the owning subgraph, then for each extending
   subgraph issues an _entities([{__typename, <key>}]) call and merges the contributed fields. --- */
function bffMermaid(bff, sgReg, fed){
  const rest=M.restOps.find(o=>restRefOf(o)===bffRef);
  const route=rest?`${rest.method} ${rest.path}`:(bffRef||"BFF");
  // message text keeps parens/colons (only the first ':' splits target from text); labels stay plain
  const msg=s=>String(s==null?"":s).replace(/"/g,"'").replace(/\n/g," ");
  const lbl=s=>String(s==null?"":s).replace(/["():;#]/g,"").replace(/\n/g," ").trim();
  const L=["sequenceDiagram","  autonumber"];
  L.push(`  participant C as Client · ${lbl(route)}`);
  L.push("  participant R as FedGQL Router");
  if(fed && fed.ok){
    const E=fed.entity, K=fed.key;
    const ownArgs=(fed.owner.args||[]).map(a=>a.name).join(", ");
    L.push(`  participant S0 as ${lbl(fed.ownerOp.entityId||"owner")} · owns ${lbl(E.name)}`);
    fed.extensions.forEach((x,i)=>L.push(`  participant S${i+1} as ${lbl(x.op.entityId||"ext")} · extends ${lbl(E.name)}`));
    L.push(`  C->>R: ${msg(bff.name||"Bff")} query${ownArgs?` (${msg(ownArgs)})`:""}`);
    L.push(`  R->>S0: ${msg(fed.ownerOp.alias||fed.ownerOp.name)}(${msg(ownArgs)}) — resolve ${msg(E.name)} @key(${msg(K)})`);
    L.push(`  S0-->>R: [${msg(E.name)} { ${msg(K)}, … }]`);
    L.push(`  Note over R,S0: base entities carry @key(${msg(K)}) for the fan-out`);
    fed.extensions.forEach((x,i)=>{
      const eArgs=(x.args||[]).map(a=>a.name).join(", ");
      L.push(`  R->>S${i+1}: _entities([{__typename: ${msg(E.name)}, ${msg(K)}}]) · ${msg(x.fieldName)}(${msg(eArgs)})`);
      L.push(`  S${i+1}-->>R: { ${msg(x.fieldName)}: {…} } merged onto ${msg(E.name)} by @key`);
    });
    L.push(`  R-->>C: one merged ${msg(E.name)} graph`);
  } else {
    L.push(`  C->>R: ${msg(bff.name||"Bff")} query`);
    L.push(`  Note over R: ${msg((fed&&fed.note)||"pick an owning query with a @key entity")}`);
    L.push("  R-->>C: (federation not configured)");
  }
  return L.join("\n");
}
let bffMermaidReady=false;
function ensureMermaid(){ if(!bffMermaidReady && window.mermaid){ mermaid.initialize({ startOnLoad:false, theme:"neutral", securityLevel:"loose" }); bffMermaidReady=true; } }
// Mermaid renders are queued: overlapping mermaid.render() calls share SVG marker ids, which drops
// the arrowheads / step numbers from whichever diagram finishes second.
let mermaidQueue=Promise.resolve();
function renderBffGraph(src, id){ mermaidQueue=mermaidQueue.then(()=>renderMermaidNow(src, id)).catch(()=>{}); return mermaidQueue; }
async function renderMermaidNow(src, id){
  id=id||"bffGraph";
  const out=document.getElementById(id); if(!out||!src) return;
  ensureMermaid();
  if(!window.mermaid){ out.innerHTML='<div class="empty">Mermaid failed to load (offline?). The source below is still valid.</div>'; return; }
  try{ const { svg }=await mermaid.render(id+"_"+Date.now()+"_"+Math.floor(Math.random()*1e6), src); out.innerHTML=uniqueMarkers(svg, id); }
  catch(e){ out.innerHTML='<div class="empty">Could not render diagram: '+esc(e.message)+'</div>'; }
}
// Mermaid names its arrowhead / sequence-number <marker>s with fixed ids; a hidden diagram elsewhere on
// the page (e.g. the single-op view while in BFF mode) would win the url(#id) lookup and the visible
// diagram loses its arrows. Suffix this diagram's marker ids and references so each SVG is self-contained.
function uniqueMarkers(svg, tag){
  const ids=[...svg.matchAll(/<marker\b[^>]*\bid="([^"]+)"/g)].map(m=>m[1]); if(!ids.length) return svg;
  const sfx="-"+tag+"-"+Date.now().toString(36);
  for(const idv of new Set(ids)){
    const e=idv.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    svg=svg.replace(new RegExp(`id="${e}"`,"g"), `id="${idv}${sfx}"`).replace(new RegExp(`url\\(#${e}\\)`,"g"), `url(#${idv}${sfx})`);
  }
  return svg;
}
// Diagram card: rendered SVG + copyable Mermaid source.
function mermaidBlock(id, title, hint, src){
  return `<div class="code-head" style="margin-top:10px"><h3>${title} ${hint?`<span class="hint">${hint}</span>`:""}</h3><button class="copy-btn" onclick='copyText(${attrJson(src)})'>Copy Mermaid</button></div>
    <div id="${id}" style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px;overflow:auto"></div><pre class="code">${esc(src)}</pre>`;
}

/* --- which subgraph serves what (Entities.BusinessApplication = subgraph) --- */
function subgraphOf(entityId){ const e=(M.entities||[]).find(x=>String(x.EntityID||"")===String(entityId)); return (e&&(String(e.BusinessApplication||"").trim()||e.Name))||entityId||"subgraph"; }
function keyOwnerOf(typeName){ const r=(M.reg.Schema||[]).find(x=>x.Kind==="Key" && x.TypeName===typeName); return r?String(r.EntityID||""):""; }
const mmMsg=s=>String(s==null?"":s).replace(/"/g,"'").replace(/[\n;#]/g," ");
const mmLbl=s=>String(s==null?"":s).replace(/["():;#,]/g,"").replace(/\n/g," ").trim();

/* --- single operation: client → router → owning subgraph, plus the _entities fan-out to every
   subgraph that owns an entity selected in the response (resolved by @key) --- */
function opSequenceMermaid(gqlSel, cx, sgReg){
  const acc=[]; gqlSelection(cx.retEnt, sgReg, "  ", 0, acc);
  const own=String(gqlSel.EntityID||""), kw=cx.gqlOp.opKind==="mutation"?"mutation":"query";
  const args=(cx.gqlOp.args||[]).map(a=>a.name).join(", ");
  const fan=[], seen=new Set();
  const retOwner=keyOwnerOf(cx.retEnt.name);
  if(cx.retEnt.isEntity && retOwner && retOwner!==own) acc.unshift({ type:cx.retEnt.name, key:cx.retEnt.key, fields:(cx.retEnt.fields||[]).map(f=>f.name) });
  for(const e of acc){ const o=keyOwnerOf(e.type); if(!o || o===own || seen.has(e.type)) continue; seen.add(e.type); fan.push({ ...e, owner:o }); }
  const L=["sequenceDiagram","  autonumber",
    `  participant C as Client · ${mmLbl(cx.restReqLine)}`,
    "  participant R as FedGQL Router",
    `  participant S0 as ${mmLbl(subgraphOf(own))} subgraph`];
  const sgIdx={}; fan.forEach(f=>{ const sg=subgraphOf(f.owner); if(!(sg in sgIdx)){ sgIdx[sg]=Object.keys(sgIdx).length+1; L.push(`  participant S${sgIdx[sg]} as ${mmLbl(sg)} subgraph`); } });
  L.push(`  C->>R: ${kw} ${mmMsg(cap(cx.gqlOp.name))}${args?` (${mmMsg(args)})`:""}`);
  L.push(`  R->>S0: ${mmMsg(cx.gqlOp.name)}(${mmMsg(args)})`);
  if(kw==="mutation") L.push("  Note over S0: mutation resolver writes, then returns the payload");
  L.push(`  S0-->>R: ${mmMsg(baseType(cx.gqlOp.returns))}${fan.length?` incl. ${mmMsg(fan.map(f=>f.type+" {"+f.key+"}").join(", "))}`:""}`);
  for(const f of fan){
    const i=sgIdx[subgraphOf(f.owner)], more=(f.fields||[]).filter(x=>x!==f.key);
    L.push(`  R->>S${i}: _entities([{__typename: ${mmMsg(f.type)}, ${mmMsg(f.key)}}]) · ${mmMsg(more.slice(0,4).join(", "))}${more.length>4?" …":""}`);
    L.push(`  S${i}-->>R: ${mmMsg(f.type)} fields merged by @key(${mmMsg(f.key)})`);
  }
  L.push(`  R-->>C: { data: { ${mmMsg(cx.gqlOp.name)} } }`);
  return L.join("\n");
}

/* --- BFF migration patterns.
   • Orchestration — the BFF endpoint has logic (e.g. POST /bff/checkout). Pick the orchestrating
     mutation (submitCheckout): its subgraph (checkout) takes over the logic in its service and calls
     the other subgraph services over REST or gRPC (Call via, per op). The client sends ONE mutation.
   • Query stitching — no orchestrating mutation: the front end sends one federated query and the
     router stitches the subgraphs by @key. No server code; nothing calls the graph from a subgraph. --- */
function bffOrchestratorOp(m){ return (m.ops||[]).find(o=>o.kind==="mutation" && String(o.opId)===String(m.orchestrator||"")) || null; }
function setBffOrchestrator(opId){ const m=curBff(); if(m){ m.orchestrator=String(opId||""); saveBff(); render(); } }
function bffOpDoc(model, kw){
  const vars=model.varDefs.length?`(${model.varDefs.join(", ")})`:"";
  return `${kw} ${cap(model.alias)}${vars} {\n${model.field.replace(/^ {4}/gm,"  ")}\n}`;
}
// REST binding of a BFF op row (via its registry op's REST: link).
function restBindingOf(o){ const reg=M.gqlOps.find(g=>String(g.id)===String(o.opId)); return reg?restBinding(reg):null; }
// The orchestrator subgraph and its op, in the shape the subgraph generators take.
function orchSubgraph(orchRow){
  const sgm=subgraphModel(orchRow.entityId), op=sgm.ops.find(o=>String(o.id)===String(orchRow.opId));
  return op ? { sgm, op } : null;
}
function bffMutationFlow(bff, sgReg){
  const orch=bffOrchestratorOp(bff), muts=(bff.ops||[]).filter(o=>o.kind==="mutation");
  if(!muts.length) return null;
  const rest=M.restOps.find(o=>restRefOf(o)===bffRef), route=rest?`${rest.method} ${rest.path}`:(bffRef||"BFF");
  const L=["sequenceDiagram","  autonumber", `  participant C as Client · ${mmLbl(route)}`, "  participant R as FedGQL Router"];
  const argNames=mo=>mo.args.map(a=>a.name).join(", ");
  if(orch){
    const om=bffOpModel(orch, sgReg), plan=orchestrationOf(orch.opId, bffRef), osg=subgraphOf(orch.entityId);
    L.push(`  participant O as ${mmLbl(osg)} subgraph · orchestrator`);
    const idx={};
    for(const st of plan.steps) if(st.via!=="local" && !(st.sg+st.via in idx)){ idx[st.sg+st.via]="P"+(Object.keys(idx).length+1); L.push(`  participant ${idx[st.sg+st.via]} as ${mmLbl(st.sg)} service · ${st.via==="rest"?"REST":"gRPC"}`); }
    L.push(`  C->>R: mutation ${mmMsg(cap(om.alias))} (${mmMsg(argNames(om))})`);
    L.push(`  R->>O: ${mmMsg(om.name)}(${mmMsg(argNames(om))}) · GraphQL API`);
    L.push(`  Note over O: ${mmMsg(osg)} service runs the BFF logic — it calls other subgraph services over REST / gRPC, never through the router`);
    for(const st of plan.steps){
      if(st.via==="local"){ L.push(`  Note over O: ${st.n}. ${mmMsg(st.model.name)} — in-process`); continue; }
      const P=idx[st.sg+st.via];
      L.push(`  O->>${P}: ${st.n}. ${st.via==="rest"?"REST "+mmMsg(st.c.method+" "+st.c.path):"gRPC "+mmMsg(st.Sg+"Service/"+Pascal(st.model.name))}${st.write?" · write":""}`);
      L.push(`  ${P}-->>O: ${mmMsg(baseType(st.model.returns)||"result")}`);
    }
    if(plan.steps.some(st=>st.write)) L.push("  Note over O: on failure, compensate the completed writes (e.g. refund / restore the cart)");
    L.push(`  O-->>R: ${mmMsg(baseType(om.returns)||"result")}`);
    L.push(`  R-->>C: { data: { ${mmMsg(om.alias)} } }`);
    const doc=bffOpDoc(om, "mutation");
    const vars={}; for(const a of om.args) vars[`${om.prefix}_${a.name}`]=sampleForType(a.type, sgReg, 1);
    return { orchestrated:true, orch, om, plan, doc, vars, mermaid:L.join("\n") };
  }
  const idx={}, part=eid=>{ const sg=subgraphOf(eid); if(!(sg in idx)){ idx[sg]="S"+(Object.keys(idx).length+1); L.push(`  participant ${idx[sg]} as ${mmLbl(sg)} subgraph`); } return idx[sg]; };
  const models=muts.map(o=>bffOpModel(o, sgReg));
  models.forEach((mo,i)=>part(muts[i].entityId));
  L.push(`  C->>R: mutation ${mmMsg(bff.name||"Bff")}`);
  L.push("  Note over R: root mutation fields execute serially in document order — results can't be piped into the next field");
  models.forEach((mo,i)=>{ const P=idx[subgraphOf(muts[i].entityId)];
    L.push(`  R->>${P}: ${mmMsg(mo.alias)}: ${mmMsg(mo.name)}(${mmMsg(argNames(mo))})`);
    L.push(`  ${P}-->>R: ${mmMsg(baseType(mo.returns)||"result")}`); });
  L.push(`  R-->>C: { data: { ${mmMsg(models.map(mo=>mo.alias).join(", "))} } }`);
  return { orchestrated:false, mermaid:L.join("\n") };
}

/* --- BFF client generators: call the composed operation(s) in one round-trip --- */
const BFF_CLIENT_LANGS={
  "JavaScript": (bff, comp)=>{
    const aliases=bffAliases(comp), vars=JSON.stringify(comp.__vars||{}, null, 2);
    const calls=[];
    if(comp.query) calls.push(`const query = \`${tStr(comp.query.doc)}\`;`);
    if(comp.mutation) calls.push(`const mutation = \`${tStr(comp.mutation.doc)}\`;`);
    const run=`const post = (q) => fetch(GRAPHQL_GATEWAY_URL, {\n  method: "POST",\n  headers: { "Content-Type": "application/json" },\n  body: JSON.stringify({ query: q, variables })\n}).then(r => r.json());`;
    const runs=[comp.query?"const { data: qd } = await post(query);":"", comp.mutation?"const { data: md } = await post(mutation);":""].filter(Boolean).join("\n");
    const merged=`const { ${aliases.join(", ")} } = { ${[comp.query?"...qd":"",comp.mutation?"...md":""].filter(Boolean).join(", ")} };`;
    const code=`// Client — one round-trip to the gateway for ${bff.name||"Bff"}\nconst variables = ${vars};\n${calls.join("\n")}\n${run}\n${runs}\n${merged}`;
    return { codeTitle:`JavaScript client — composed ${bff.name||"Bff"}`, code };
  },
  "Java": (bff, comp)=>{
    const doc=comp.query?comp.query.doc:(comp.mutation?comp.mutation.doc:"");
    const code=`// Client — call the composed operation on the gateway\nString query = "${jStr(doc)}";\nMap<String,Object> body = Map.of("query", query, "variables", variables);\nHttpRequest req = HttpRequest.newBuilder()\n    .uri(URI.create(System.getenv("GRAPHQL_GATEWAY_URL")))\n    .header("Content-Type","application/json")\n    .POST(BodyPublishers.ofString(mapper.writeValueAsString(body)))\n    .build();\nHttpResponse<String> res = client.send(req, BodyHandlers.ofString());\n// res.body(): { "data": { ${bffAliases(comp).map(a=>`"${a}": {…}`).join(", ")} } }`;
    return { codeTitle:`Java client — composed ${bff.name||"Bff"}`, code };
  },
  "Android (Kotlin)": (bff, comp)=>{
    const aliases=bffAliases(comp);
    const code=`// Client (Apollo Kotlin) — composed ${bff.name||"Bff"}\nval response = apolloClient.query(${cap(bff.name||"Bff")}Query(/* variables */)).execute()\n${aliases.map(a=>`val ${a} = response.data?.${a}`).join("\n")}`;
    return { codeTitle:`Android (Kotlin) client — composed ${bff.name||"Bff"}`, code };
  },
  "iOS (Swift)": (bff, comp)=>{
    const aliases=bffAliases(comp);
    const code=`// Client (Apollo iOS) — composed ${bff.name||"Bff"}\napollo.fetch(query: ${cap(bff.name||"Bff")}Query(/* variables */)) { result in\n  guard let data = try? result.get().data else { return }\n${aliases.map(a=>`  let ${a} = data.${a}`).join("\n")}\n}`;
    return { codeTitle:`iOS (Swift) client — composed ${bff.name||"Bff"}`, code };
  },
};

    const restArgs=(bffRestOp.args||[]), bodyArg=restArgs.find(a=>a.name==="input"), paramArgs=restArgs.filter(a=>a.name!=="input");

      <div class="grid2">${currentBlock}${targetBlock}</div>`;

    // sequence trace — how the router wires the responses across subgraphs via @key
    const seqBlock=`<div class="code-head" style="margin-top:10px"><h3>Sequence trace <span class="hint">(router resolves the base entity, then <span class="mono">_entities</span> fan-out wires each subgraph by <span class="mono">@key</span>)</span></h3><button class="copy-btn" onclick='copyText(${attrJson(mmSrc)})'>Copy source</button></div>
      <div id="bffGraph" style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px;overflow:auto"></div><pre class="code" id="bffMermaidSrc">${esc(mmSrc)}</pre>`;

    let fedBody=sideBySide;
    if(fed.ok){
      const sdlBlocks=fed.sdl.map(b=>`<div><div class="code-head"><h3>${esc(b.label)}</h3><button class="copy-btn" onclick='copyText(${attrJson(b.sdl)})'>Copy</button></div><pre class="code">${highlightSDL(b.sdl)}</pre></div>`).join("");
      fedBody+=`<div class="kv" style="margin-top:10px">Subgraph SDL — <span class="mono">@key</span> wiring between subgraphs</div><div class="grid2">${sdlBlocks}</div>`;
    }
    fedBody+=seqBlock;

    fedHtml=`<div class="kv" style="margin-top:14px">Federation composition <span class="hint">(GraphQL-federation style — one subgraph owns the entity via <span class="mono">@key</span>, the others <span class="mono">extend</span> it)</span></div>
      ${ownerSelHtml?`<div class="selrow" style="margin:4px 0">${ownerSelHtml}</div>`:""}
      ${fedBody}
`;
  }

  // mutation flow — orchestrating mutation (saga) or serial root mutation fields, with Mermaid trace
  let mutHtml="";
  if(flow){
    const mutOps=m.ops.filter(o=>o.kind==="mutation");
    const orchSel=`<label><b>Orchestrating mutation</b> <select onchange="setBffOrchestrator(this.value)"><option value="">— none: the router runs the mutation fields serially —</option>${mutOps.map(o=>`<option value="${esc(o.opId)}"${String(m.orchestrator||"")===String(o.opId)?" selected":""}>${esc(o.alias||o.name)} · ${esc(subgraphOf(o.entityId))} (${esc(svcTypeOfEntity(o.entityId).type)})</option>`).join("")}</select>
      <span class="hint">the op whose subgraph takes over the BFF logic (e.g. <span class="mono">submitCheckout</span> → checkout): its service calls the other ops' services in table order over REST / gRPC</span></label>`;
    let body="";
    if(flow.orchestrated){
      const steps=flow.plan.steps, os=orchSubgraph(flow.orch), P=SERVER_PAIRS[orchLang]||SERVER_PAIRS["Node.js (Apollo Server)"], osg=subgraphOf(flow.orch.entityId);
      const route=bffRestOp?`${bffRestOp.method} ${bffRestOp.path}`:bffRef;
      const cur=(LEGACY_BFF[orchLang]||LEGACY_BFF["Node.js (Apollo Server)"])({ name:m.name||"Bff", route, rest:bffRestOp, steps });
      const tgt=os?P.svc(os.sgm, os.op):"// the orchestrating op isn't in its subgraph's registry ops";
      const nR=steps.filter(s=>s.via==="rest").length, nG=steps.filter(s=>s.via==="grpc").length, nL=steps.length-nR-nG;
      body=`<div class="selrow" style="margin:6px 0;align-items:center">
          <label><b>Language</b> <select onchange="setOrchLang(this.value)">${SERVER_LANG_NAMES.map(n=>`<option${n===orchLang?" selected":""}>${esc(n)}</option>`).join("")}</select></label>
          <span><span class="via rest">${nR} REST</span> <span class="via grpc">${nG} gRPC</span>${nL?` <span class="via local">${nL} in-process</span>`:""}</span>
          <span class="spacer"></span>
          <button class="btn" onclick="setAllVia('rest')" title="Call every downstream service that has a REST link over REST">All via REST</button>
          <button class="btn" onclick="setAllVia('grpc')" title="Call every downstream service over gRPC">All via gRPC</button>
        </div>
        <ol style="margin:4px 0 8px;padding-left:20px;font-size:13px">${steps.map(st=>`<li><span class="via ${st.via}">${st.via==="rest"?"REST":st.via==="grpc"?"gRPC":"in-process"}</span> <span class="mono">${esc(st.via==="rest"?st.c.method+" "+st.c.path:st.via==="grpc"?st.Sg+"Service/"+Pascal(st.model.name):st.model.name)}</span> <span class="hint">· ${esc(st.sg)} service${st.write?" · write":""}</span></li>`).join("")||'<li class="hint">add the ops the orchestrator calls</li>'}</ol>
        <div class="grid2">
          <div><div class="code-head"><h3>Current — BFF handler <span class="hint">· logic in the BFF</span></h3><button class="copy-btn" onclick='copyText(${attrJson(cur)})'>Copy</button></div><pre class="code">${esc(cur)}</pre></div>
          <div><div class="code-head"><h3>Target — <span class="mono">${esc(osg)}</span> subgraph service <span class="hint">· logic in the orchestrator subgraph</span></h3><button class="copy-btn" onclick='copyText(${attrJson(tgt)})'>Copy</button></div><pre class="code">${esc(tgt)}</pre></div>
        </div>
        ${os?`<div class="grid2" style="margin-top:10px">
          <div><div class="code-head"><h3>REST API <span class="hint">· ${esc(osg)} keeps a REST route for it</span></h3></div><pre class="code">${esc(P.rest(os.sgm, os.op))}</pre></div>
          <div><div class="code-head"><h3>GraphQL API <span class="hint">· the mutation the front end calls</span></h3></div><pre class="code">${esc(P.gql(os.sgm, os.op, os.op))}</pre></div>
        </div>`:""}
        <div class="grid2" style="margin-top:10px">
          <div><div class="code-head"><h3>Front end — mutation it sends</h3><button class="copy-btn" onclick='copyText(${attrJson(flow.doc)})'>Copy</button></div><pre class="code">${highlightSDL(flow.doc)}</pre></div>
          <div><div class="code-head"><h3>Variables</h3></div><pre class="code">${esc(JSON.stringify(flow.vars,null,2))}</pre></div>
        </div>
        ${mermaidBlock("bffMutGraph", "Mutation orchestration", `(one client mutation; the ${esc(osg)} subgraph calls each service over REST / gRPC and compensates on failure)`, flow.mermaid)}`;
    } else {
      body=mermaidBlock("bffMutGraph", "Mutation sequence", "(root mutation fields run serially in document order)", flow.mermaid);
    }
    mutHtml=`<div class="kv" style="margin-top:14px">Mutation flow</div><div class="selrow" style="margin:4px 0">${orchSel}</div>${body}`;
  }

  // output/language controls + generated code
  const outSelHtml=`<label><b>Output</b> <select onchange="setOut(this.value)">${["Client","Server"].map(o=>`<option${o===outKind?" selected":""}>${o}</option>`).join("")}</select></label>`;
  const langSelHtml=`<label><b>Language</b> <select onchange="setLang(this.value)">${langNames().map(n=>`<option${n===lang?" selected":""}>${esc(n)}</option>`).join("")}</select></label>`;
  let codeHtml="";
  if(m.ops.length && outKind==="Server"){
    const os=orchRow?orchSubgraph(orchRow):null;
    if(os){
      const files=(SUBGRAPH_SERVERS[lang]||SUBGRAPH_SERVERS["Node.js (Apollo Server)"])(os.sgm, os.op);
      codeHtml=`<div class="code-head" style="margin-top:12px"><h3>${esc(lang)} — <span class="mono">${esc(os.sgm.sgName)}</span> orchestrator subgraph <span class="hint">(one service: REST API + GraphQL API; <span class="mono">${esc(os.op.Name)}</span> carries the BFF logic)</span></h3><div class="selrow" style="margin:0">${outSelHtml}${langSelHtml}</div></div>
        ${files.map(f=>`<div class="code-head"><h3 class="mono" style="font-size:12.5px">${esc(f.title)}</h3><button class="copy-btn" onclick='copyText(${attrJson(f.code)})'>Copy</button></div><pre class="code">${f.sdl?highlightSDL(f.code):esc(f.code)}</pre>`).join("")}`;
    } else {
      codeHtml=`<div class="code-head" style="margin-top:12px"><h3>Server code</h3><div class="selrow" style="margin:0">${outSelHtml}${langSelHtml}</div></div>
        <p class="hint" style="margin:4px 0">${orchRow?"The orchestrating op isn't in its subgraph's registry ops.":"Query stitching needs no BFF or orchestrator code. The front end sends the federated query (Output → <b>Client</b>), and each subgraph's REST + GraphQL service is generated in <b>Single op</b> mode."}</p>`;
    }
  } else if(m.ops.length){
    const gen=BFF_CLIENT_LANGS[lang]||BFF_CLIENT_LANGS.JavaScript;
    const s=gen(m, comp, bffRestOp);
    codeHtml=`<div class="code-head" style="margin-top:12px"><h3>${esc(s.codeTitle)}</h3><div class="selrow" style="margin:0">${outSelHtml}${langSelHtml}</div></div>
      <div class="code-head"><h3></h3><button class="copy-btn" onclick='copyText(${attrJson(s.code)})'>Copy</button></div><pre class="code">${esc(s.code)}</pre>`;
  } else {
    codeHtml=`<div class="selrow" style="margin-top:12px">${outSelHtml}${langSelHtml}</div>`;
  }

  // per-op REST -> FedGQL field mapping (each op matched to its own legacy REST reference)
  let perOp="";
  if(m.ops.length){
    perOp=`<div class="kv">Per-op field mapping — each FedGQL op vs its legacy REST reference</div>`;
    for(const o of m.ops){
      const reg=M.gqlOps.find(g=>String(g.id)===String(o.opId)); if(!reg) continue;
      const restSel=M.restOps.find(x=>refMatches(reg,x)) || bffRestOp;
      const cx=buildOpCtx(reg, restSel, sgReg);
      perOp+=`<details class="stdref" style="margin:6px 0"><summary><span class="badge ${o.kind}">${esc(o.kind)}</span> <b>${esc(o.alias||o.name)}</b> <span class="hint">· ${esc(o.entityId||"")} · ${esc(cx.restReqLine)} ${cx.mapNote}</span></summary>
        <div style="padding:8px 0">${cx.changesHtml}
        <div class="table-wrap"><table><thead><tr><th>REST field : type</th><th>FedGQL field : type</th><th>Change</th></tr></thead><tbody>${cx.fieldRowsHtml}</tbody></table></div></div></details>`;
    }
  }

  host.innerHTML = `<h3 style="margin:0 0 2px">${esc(m.name||"Bff")} <small class="hint">· BFF <span class="mono">${esc(bffRef)}</span> · ${m.ops.length} op(s) · ${esc(M.sgName||"registry")}</small></h3>
    ${tableHtml}${patternHtml}${composedHtml}${fedHtml}${mutHtml}${codeHtml}${perOp}`;
  if(fedHtml) renderBffGraph(mmSrc);   // deferred: host.innerHTML was just replaced, so #bffGraph exists now
  if(flow) renderBffGraph(flow.mermaid, "bffMutGraph");
}
function opMenuHtml(){
  const byEnt={};
  for(const o of M.gqlOps) (byEnt[o.EntityID]=byEnt[o.EntityID]||[]).push(o);
  let h='<div class="op-menu">';
  for(const [eid,list] of Object.entries(byEnt)){
    const ent=(M.entities||[]).find(e=>String(e.EntityID||"")===String(eid));
    h+=`<div class="grp">${esc(eid||"(no entity)")}${ent&&ent.Name?" · "+esc(ent.Name):""}</div>`;
    for(const o of list) h+=`<button class="opt" onclick='addBffOp(${attrJson(String(o.id))})'><span class="badge ${o.kind}">${esc(o.kind)}</span> ${esc(o.Name)} <span class="hint">: ${esc(o.ReturnType||"")}</span></button>`;
  }
  return h+'</div>';
}

/* ------------------------------ boot ----------------------------------- */
document.getElementById("f-reg")?.addEventListener("change", e=>onReg(e.target));
document.getElementById("f-rest")?.addEventListener("change", e=>onRest(e.target));
document.addEventListener("click", e=>{ if(openMenu && !e.target.closest(".op-picker")){ openMenu=false; if(mode==="bff") renderBff(); } });
loadBff();
populateLangSelect();
tryAutoFetch();
</script>
<script src="onboarding.js"></script>
<script src="code-onboarding.js"></script>
</body>
</html>
