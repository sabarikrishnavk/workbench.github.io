<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FedGQL Migration Workbench</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="common.js"></script>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="onboarding.css" />
<style>
  :root{
    --bg: #f6f7f9; --panel: #fff; --ink: #1f2933; --muted: #6b7280; --line: #e4e7eb;
    --accent: #7048e8; --accent-soft: #efe9fd; --query: #0b7285; --mutation: #b45309; --sub: #15803d;
    --ok: #15803d; --bad: #b91c1c; --warn: #b45309;
  }
  body{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; display: flex; flex-direction: column; height: 100vh; }
  header{ background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .status b{ color: var(--ink); }
  .status .miss{ color: var(--bad); }
  nav{ background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 2px; padding: 0 12px; flex-wrap: wrap; }
  main{ flex: 1; overflow: auto; padding: 16px; }
  th{ background: #fafbfc; position: sticky; top: 0; font-weight: 600; }
  .table-wrap{ overflow: auto; max-height: 62vh; border: 1px solid var(--line); border-radius: 8px; }
  td input.cell, td textarea.cell, td select.cell{ width: 100%; box-sizing: border-box; padding: 3px 5px; border: 1px solid transparent; border-radius: 5px; font: inherit; background: transparent; }
  td input.cell:hover, td textarea.cell:hover, td select.cell:hover{ border-color: var(--line); }
  td input.cell:focus, td textarea.cell:focus, td select.cell:focus{ border-color: var(--accent, #4c8bf5); background: #fff; outline: none; }
  td textarea.cell{ min-height: 40px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
  /* Standards validation: flagged cells + issues panel */
  td.cell-invalid, td.cell-invalid input.cell, td.cell-invalid textarea.cell, td.cell-invalid select.cell{ outline: 2px solid #d33; outline-offset: -2px; border-radius: 3px; }
  td.cell-warn, td.cell-warn input.cell, td.cell-warn textarea.cell, td.cell-warn select.cell{ outline: 2px solid #e0a800; outline-offset: -2px; border-radius: 3px; }
  .stdpanel{ border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .stdpanel.ok{ border-color: #bfe3c6; background: #f2fbf4; }
  .stdpanel.err{ border-color: #f0c9c9; background: #fdf3f3; }
  .stdpanel.warn{ border-color: #f0d9a8; background: #fdf9ef; }
  .stdpanel ul{ margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; max-height: 220px; overflow: auto; }
  .stdpanel li{ margin: 3px 0; }
  .stdpanel a{ color: var(--accent); }
  .stdpanel .fix{ color: var(--muted); }
  .sev{ display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
  .sev.error{ background: #fdeaea; color: #b91c1c; }
  .sev.warning{ background: #fdf4e7; color: #b45309; }
  .sev.info{ background: #eef2ff; color: #3730a3; }
  details.stdref{ font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  details.stdref summary{ cursor: pointer; color: var(--ink); }
  tr.rowviol td{ padding: 5px 10px 8px; border-top: 0; }
  tr.rowviol.warn td{ background: #fdf9ef; box-shadow: inset 3px 0 0 #e0a800; }
  tr.rowviol.error td{ background: #fdf3f3; box-shadow: inset 3px 0 0 #d33; }
  tr.rowviol .rowviol-in{ display: flex; flex-direction: column; gap: 3px; }
  tr.rowviol .rvi{ font-size: 12px; line-height: 1.4; }
  tr.rowviol .rvi .fix{ color: var(--muted); }
  tr.rowviol a{ color: var(--accent); }
  .tag{ display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); margin: 1px 2px; white-space: nowrap; }
  .tag.on{ color: var(--ok);   border-color: var(--ok);   background: #eafaf0; }
  .tag.bff{ color: var(--warn); border-color: var(--warn); background: #fdf4e7; }
  .tag.off{ color: var(--bad);  border-color: var(--bad);  background: #fdeaea; }
  .tag.plat{ color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .tag.tbc{ color: var(--muted); }
  .tag.asg{ color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .kv{ color: var(--muted); font-size: 12px; margin: 10px 0 3px; text-transform: uppercase; letter-spacing: .03em; }
  .addrow{ text-transform: none; letter-spacing: 0; font-size: 12px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--fg); border-radius: 6px; padding: 1px 8px; margin-left: 6px; }
  .addrow:hover{ background: var(--accent, #2563eb); color: #fff; border-color: transparent; }
  .rm-row{ cursor: pointer; border: 1px solid var(--line); background: #fff; color: #b91c1c; border-radius: 5px; padding: 0 5px; font-size: 11px; line-height: 1.4; margin-left: 4px; }
  .rm-row:hover{ background: #b91c1c; color: #fff; border-color: transparent; }
  .split{ display: grid; grid-template-columns: 320px 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: calc(100vh - 210px); min-height: 420px; }
  .split .side{ border-right: 1px solid var(--line); background: #fbfbfd; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .split .side .filters{ padding: 8px; border-bottom: 1px solid var(--line); }
  .split .side .filters input{ width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .list{ overflow: auto; flex: 1; min-height: 0; }
  .grp{ padding: 6px 10px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #f3f4f6; position: sticky; top: 0; }
  .item{ padding: 6px 10px; cursor: pointer; border-left: 3px solid transparent; font-size: 13px; }
  .item:hover{ background: #f1eefe; }
  .item.active{ background: var(--accent-soft); border-left-color: var(--accent); }
  .item .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .item small{ color: var(--muted); }
  .item .badge{ color: var(--accent); font-size: 11px; }
  .detail{ padding: 14px; overflow: auto; min-height: 0; background: #fff; }
  /* Independent, visually distinct scroll panes: neutral-grey left, accent-purple right */
  .list{ scrollbar-width: thin; scrollbar-color: #c7cdd4 #fbfbfd; }
  .detail{ scrollbar-width: thin; scrollbar-color: #d3c6f2 #fff; }
  .list::-webkit-scrollbar, .detail::-webkit-scrollbar{ width: 11px; }
  .list::-webkit-scrollbar-thumb{ background: #c7cdd4; border-radius: 8px; border: 3px solid #fbfbfd; }
  .list::-webkit-scrollbar-thumb:hover{ background: #a7b0ba; }
  .detail::-webkit-scrollbar-thumb{ background: #d3c6f2; border-radius: 8px; border: 3px solid #fff; }
  .detail::-webkit-scrollbar-thumb:hover{ background: var(--accent); }
  .detail .table-wrap{ max-height: none; border: 1px solid var(--line); }
  /* right pane is the single scroller */
  .code-head{ display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
  .grid2{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  /* Side-by-side code panes: wrap long lines (e.g. Kotlin/Apollo) instead of scrolling horizontally */
  .grid2{ min-width: 0; }
  /* Diff highlighting: changed names/types between REST source and FedGQL target */
  .picker{ border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; min-width: 240px; }
  .selrow{ display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
  .selrow select, .selrow input, .selrow textarea{ min-width: 200px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .selrow textarea{ min-width: 320px; min-height: 64px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .assign{ border: 1px solid var(--accent-soft); background: #faf9ff; border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
  .diff .only-a{ background: #fdeaea; }
  .diff .only-b{ background: #eaf1fd; }
  .diff .mismatch{ background: #fdf4e7; }
  .diff .ok td{ background: #f6fef9; }
  .counts .tag{ font-size: 12px; }
  .flag-yes{ color: var(--ok); }
  .flag-no{ color: var(--bad); }
  /* Per-row edit: read-only cells + a ✎ edit button next to the ID that opens a dialog */
  td.ro{ vertical-align: top; }
  td.ro .ro-pre{ display: block; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 120px; overflow: auto; }
  .id-cell{ display: flex; align-items: center; gap: 4px; }
  .icon-btn{ border: none; background: transparent; padding: 2px 5px; color: var(--accent); cursor: pointer; font-size: 13px; border-radius: 5px; flex: none; }
  .icon-btn:hover{ background: var(--accent-soft); }
  /* Edit dialog (same pattern as workbench.html) */
  .modal{ position: fixed; inset: 0; background: rgba(15,23,42,.4); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal[hidden]{ display: none; }
  .modal-card{ background: #fff; border-radius: 12px; padding: 20px 22px; width: 680px; max-width: 92vw; max-height: 90vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .modal-card.editor{ width: 920px; }
  .modal-card h2{ margin: 0 0 4px; font-size: 16px; }
  .modal-card .re-ent{ margin: 0 0 12px; }
  .modal-actions{ display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  /* Structured row editor (ported from workbench.html) */
  .re-grid{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
  .re-field{ display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .re-field > span{ font-weight: 600; }
  .re-field.wide{ grid-column: 1 / -1; }
  .re-field input, .re-field select, .re-field textarea, .re-table input, .re-table textarea{ width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; font: inherit; color: var(--ink); background: #fff; box-sizing: border-box; }
  .re-field textarea, .re-table textarea{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
  .re-sub{ margin: 14px 0 6px; font-size: 13px; }
  .re-table-wrap{ border: 1px solid var(--line); border-radius: 8px; padding: 6px; overflow: auto; }
  .re-table{ width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .re-table th{ text-align: left; font-weight: 600; color: var(--muted); padding: 4px; border-bottom: 1px solid var(--line); position: static; background: transparent; }
  .re-table td{ padding: 3px 4px; vertical-align: top; }
  .re-table td.re-act{ white-space: nowrap; width: 1%; }
  .re-table input.mono, .re-table textarea{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .mini-add{ margin-top: 6px; border: 1px dashed var(--line); background: #fff; color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  .mini-add:hover{ color: var(--accent); border-color: var(--accent); }
  .re-issues{ margin-top: 8px; font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
  .re-issues .rvi .fix{ color: var(--muted); }
  .modal-card pre.code{ max-height: 200px; overflow: auto; }
  .editgrid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; align-items: start; }
  .editgrid .efld{ display: flex; flex-direction: column; gap: 3px; }
  .editgrid .efld > span{ font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .editgrid .efld-wide{ grid-column: 1 / -1; }
  .editgrid .cell{ width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; }
  .editgrid textarea.cell{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; resize: vertical; min-height: 36px; }
  .editgrid .lk-wrap{ display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  @media (max-width: 1000px){ .wz-steps{ grid-template-columns: repeat(4, 1fr); } }
</style>

<body>

<datalist id="dl-domains"></datalist>
<datalist id="dl-entities"></datalist>

<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>

<script>
const LS = "gqlmig-v2";
function defaultMapping(){ return { customDomains: [], assign: {}, subgraphs: [], entityMeta: {}, focusEntity: null, migrationEntityId: "", overrides: {}, additions: {} }; }
const state = { monographText: "", monograph: null, ops: [], summary: [], entities: [], schema: [], reg: {}, regHeaders: {} };
let mapping = defaultMapping();
let selmonograph = null, selRest = null;

/* Canonical GQLRegistry.xlsx headers — the export template (used when a sheet
   was empty / not loaded so pasted rows still line up column-for-column). */
const CANON_HEADERS = {
  Entities:  ["EntityID","Name","ExperienceDomain","BusinessApplication","ServiceType","BusinessCapability","Description","Contacts","ApprovalStatus","Comments","Links"],
  Schema:    ["SchemaID","EntityID","Kind","TypeName","Definition","Description","Contacts","ApprovalStatus","Comments","Links"],
  Queries:   ["QueryID","EntityID","Name","Parameters","ReturnType","AuthScopes","Description","Contacts","ApprovalStatus","Comments","Links"],
  Mutations: ["MutationID","EntityID","Name","Parameters","ReturnType","AuthScopes","Description","Contacts","ApprovalStatus","Comments","Links"],
  AuthScopes:["ScopeID","EntityID","Scope","Persona","Permission","Description","Contacts","ApprovalStatus","Comments","Links"],
};

/* ------------------------------ utils ---------------------------------- */
// esc → common.js

function count(s, ch){ let n=0; for(const c of s) if(c===ch) n++; return n; }
// baseType, cap, uid, slug, val → common.js

function q(s){ return JSON.stringify(s).replace(/"/g,'&quot;'); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1400); }
function openModal(html){ const m=document.getElementById("modal"); document.getElementById("modalCard").innerHTML=html; m.hidden=false; }
function closeModal(){ const m=document.getElementById("modal"); if(m){ m.hidden=true; const c=document.getElementById("modalCard"); c.classList.remove("editor"); c.innerHTML=""; } }
// copyText → common.js

// highlightSDL → common.js


/* ------------------------- SDL parser (ported) -------------------------- */
function splitBlocks(text){
  const lines = text.split(/\r?\n/);
  const defstart = /^(type|input|enum|interface|union|scalar)\s+(\w+)(.*)$/;
  const out = []; let i=0, n=lines.length, pending=null, indoc=false, docbuf=[];
  while(i<n){
    const st = lines[i].trim();
    if(indoc){ docbuf.push(st.replace(/"""/g,"").trim()); if(st.includes('"""')){ indoc=false; pending=docbuf.filter(Boolean).join(" ").trim(); } i++; continue; }
    if(st.startsWith('"""')){ if((st.match(/"""/g)||[]).length>=2 && st.length>3){ pending=st.replace(/"""/g,"").trim(); } else { indoc=true; docbuf=[st.replace(/"""/g,"").trim()]; } i++; continue; }
    if(st.startsWith("#")){ i++; continue; }
    const m = st.match(defstart);
    if(m){
      const kind=m[1], name=m[2], rest=m[3];
      if(kind==="scalar" || kind==="union"){ out.push({kind,name,header:rest,body:[],desc:pending,raw:lines[i]}); pending=null; i++; continue; }
      let header=rest, j=i;
      while(!header.includes("{") && j+1<n){ j++; header+=" "+lines[j].trim(); }
      if(!header.includes("{")){ pending=null; i++; continue; }
      let bal = count(header,"{")-count(header,"}"); const body=[]; let k=j+1;
      while(k<n && bal>0){ const l=lines[k]; bal += count(l,"{")-count(l,"}"); if(bal>0) body.push(l); k++; }
      out.push({kind,name,header,body,desc:pending,raw:lines.slice(i,k).join("\n")});
      pending=null; i=k; continue;
    }
    pending=null; i++;
  }
  return out;
}
function parseFields(body){
  let pending=null, indoc=false, docbuf=[]; const clean=[];
  for(const raw of body){
    const st = raw.trim();
    if(indoc){ docbuf.push(st.replace(/"""/g,"").trim()); if(st.includes('"""')){ indoc=false; pending=docbuf.filter(Boolean).join(" ").trim(); } continue; }
    if(st.startsWith('"""')){ if((st.match(/"""/g)||[]).length>=2 && st.length>3){ pending=st.replace(/"""/g,"").trim(); } else { indoc=true; docbuf=[st.replace(/"""/g,"").trim()]; } continue; }
    if(st==="" || st.startsWith("#")) continue;
    clean.push([st,pending]); pending=null;
  }
  const fields=[]; let i=0; const N=clean.length;
  while(i<N){
    let cur=clean[i][0]; const desc=clean[i][1]; let pdepth=count(cur,"(")-count(cur,")"); i++;
    while(i<N && pdepth>0){ cur+=" "+clean[i][0]; pdepth+=count(clean[i][0],"(")-count(clean[i][0],")"); i++; }
    while(i<N && clean[i][0].trimStart().startsWith("@")){ cur+=" "+clean[i][0]; i++; }
    const m = cur.match(/^(\w+)\s*(\([\s\S]*?\))?\s*:\s*(.+)$/);
    if(m){
      const name=m[1]; let args=(m[2]||""); args = args ? args.slice(1,-1).trim().replace(/\s+/g," ") : "";
      let rest=m[3].trim(); const ai=rest.indexOf("@");
      const type=(ai>=0?rest.slice(0,ai):rest).trim();
      fields.push({name, args, type, desc: desc||""});
    }
  }
  return fields;
}
function fieldSig(f){ return `${f.name}${f.args?"("+f.args+")":""}: ${f.type}`; }
function parseSDL(text){
  const blocks = splitBlocks(text);
  const types=[]; const roots={Query:[],Mutation:[],Subscription:[]};
  for(const b of blocks){
    if(b.kind==="type" && roots[b.name]){ roots[b.name] = parseFields(b.body); continue; }
    const fields = (b.kind==="type"||b.kind==="input"||b.kind==="interface") ? parseFields(b.body) : [];
    const keys=[]; for(const km of b.header.matchAll(/@key\s*\(\s*fields:\s*"([^"]+)"/g)) keys.push(...km[1].split(/\s+/));
    types.push({kind:b.kind, name:b.name, keyFields:keys, fields, raw:b.raw, desc:b.desc||""});
  }
  return {types, roots};
}
// keyOf → common.js

function asKeyEntity(t){
  const body = t.fields.map(f=>`  ${f.name}: ${f.type}`).join("\n");
  return `type ${t.name} @key(fields: "${keyOf(t.fields,t.keyFields)}") {\n${body}\n}`;
}
function monographTypeByName(n){ return state.monograph ? state.monograph.types.find(t=>t.name===n) : null; }
function monographRootByName(root, n){ return state.monograph ? state.monograph.roots[root].find(f=>f.name===n) : null; }

/* ---------------- OpenAPI → GraphQL subgraph (full expansion) ----------- */
// gqlScalar, refName, derefSchema → common.js

// Own-identity key only: a field named `id`, or `<typeName>Id` (not a foreign key). Returns key field name or "".
// entityKey → common.js

function jsonGqlType(v, k){
  if(Array.isArray(v)) return "["+(v.length?jsonGqlType(v[0],k):"String")+"]";
  if(v===null) return "String";
  if(typeof v==="number") return Number.isInteger(v)?"Int":"Float";
  if(typeof v==="boolean") return "Boolean";
  if(typeof v==="object") return cap(k);
  return "String";
}
function jsonToFields(obj){
  if(Array.isArray(obj)) obj=obj[0]||{};

  return Object.entries(obj).map(([k,v])=>({name:k, type:jsonGqlType(v,k)}));
}
// One OpenAPI spec → one subgraph {id,name,spec,ops,types}
function parseOpenAPI(text, sgName){
  let spec; text=String(text||"").trim();
  try{ spec = text.startsWith("{") ? JSON.parse(text) : jsyaml.load(text); }
  catch(e){ try{ spec = jsyaml.load(text); }catch(e2){ throw new Error("Could not parse spec as JSON or YAML"); } }
  const comps = (spec.components && spec.components.schemas) || spec.definitions || {};
  // component names referenced by a requestBody → GraphQL `input` types (not @key entities)
  const inputNames=new Set();
  for(const pathOps of Object.values(spec.paths||{})){
    for(const op of Object.values(pathOps||{})){
      const rb=op && op.requestBody && op.requestBody.content && op.requestBody.content["application/json"] && op.requestBody.content["application/json"].schema;
      if(rb && rb.$ref) inputNames.add(refName(rb.$ref));
    }
  }
  const types=[]; const byName={};
  function addType(t){ if(!t.name) return null; if(byName[t.name]) return byName[t.name]; byName[t.name]=t; types.push(t); return t; }
  // Resolve a schema to a GraphQL type string, registering inline objects/enums as named types.
  function resolveType(sch, fallback){
    if(!sch) return "String";
    if(sch.$ref){ return refName(sch.$ref); }
    if(Array.isArray(sch.enum)){ const nm=cap(fallback||"Enum"); addType({name:nm, kind:"enum", isEntity:false, key:"", fields:[], values:sch.enum.map(String)}); return nm; }
    if(sch.type==="array"){ return "["+resolveType(sch.items, fallback)+"]"; }
    if(sch.type==="object" || sch.properties){
      const nm=cap(fallback||"Object");
      const fields=objFields(sch, nm);
      const k=entityKey(nm, fields);
      addType({name:nm, kind:"type", isEntity:!!k, key:k, fields, values:[]});
      return nm;
    }
    return gqlScalar(sch.type);
  }
  function objFields(sch, ownerName){
    const props=sch.properties||{}; const req=new Set(sch.required||[]);
    return Object.entries(props).map(([k,v])=>{ let t=resolveType(v, ownerName+cap(k)); if(req.has(k)) t+="!"; return {name:k, type:t}; });
  }
  // 1) named component schemas → named GraphQL types
  for(const [name, sch] of Object.entries(comps)){
    const nm=cap(slug(name).replace(/ /g,"")) || name;
    if(sch && Array.isArray(sch.enum)){ addType({name:nm, kind:"enum", isEntity:false, key:"", fields:[], values:sch.enum.map(String)}); continue; }
    const s=derefSchema(sch, comps);
    if(s.type==="object" || s.properties){
      const fields=objFields(s, nm);
      if(inputNames.has(nm)) addType({name:nm, kind:"input", isEntity:false, key:"", fields, values:[]});
      else { const k=entityKey(nm, fields); addType({name:nm, kind:"type", isEntity:!!k, key:k, fields, values:[]}); }
    } else if(Array.isArray(s.enum)){
      addType({name:nm, kind:"enum", isEntity:false, key:"", fields:[], values:s.enum.map(String)});
    } else {
      // scalar / array alias — wrap so it survives as a type row
      addType({name:nm, kind:"type", isEntity:false, key:"", fields:[{name:"value", type:(resolveType(s, nm+"Value")||"String")}], values:[]});
    }
  }
  // 2) operations
  const ops=[]; const paths=spec.paths||{};
  for(const [p, pathOps] of Object.entries(paths)){
    const shared = (pathOps && pathOps.parameters) || [];
    for(const [method, op] of Object.entries(pathOps||{})){
      if(!["get","post","put","patch","delete"].includes(String(method).toLowerCase())) continue;
      if(!op || typeof op!=="object") continue;
      const opName = op.operationId || (method+cap(slug(p)).replace(/ /g,""));
      const resp=(op.responses && (op.responses["200"]||op.responses["201"]||op.responses["2XX"]||op.responses.default))||{};
      const rsch=(resp.content && resp.content["application/json"] && resp.content["application/json"].schema) || resp.schema || null;
      const returns = rsch ? resolveType(rsch, opName+"Response") : "Boolean";
      const args=[];
      for(const pr of [...shared, ...(op.parameters||[])]){
        if(!pr || pr.$ref) continue;
        if(["path","query"].includes(pr.in) || pr.in==null){
          const t=(pr.schema?resolveType(pr.schema, opName+cap(pr.name||"Arg")):gqlScalar(pr.type))||"String";
          args.push({name:pr.name, type:t+(pr.required?"!":"")});
        }
      }
      const rb = op.requestBody && op.requestBody.content && op.requestBody.content["application/json"] && op.requestBody.content["application/json"].schema;
      if(rb){ const t=resolveType(rb, opName+"Input"); const it=byName[baseType(t)]; if(it && it.kind==="type"){ it.kind="input"; it.isEntity=false; it.key=""; } args.push({name:"input", type:t+(op.requestBody.required?"!":"")}); }
      const bt=baseType(returns);
      const entity = byName[bt] ? bt : "";
      ops.push({ id:uid(), name:opName, method:String(method).toUpperCase(), path:p,
        opKind: String(method).toLowerCase()==="get"?"query":"mutation",
        args, returns, entity, notes: op.summary||op.description||"" });
    }
  }
  return { id:uid(), name:sgName, spec:"", ops, types };
}

/* --------------- subgraph → federated SDL / registry rows --------------- */
function typeKind(t){ if(t.ext) return t.ext.mode==="extend"?"Extend":"Reference"; return t.kind==="enum"?"Enum":(t.kind==="input"?"Input":(t.isEntity?"Key":"Type")); }
function typeSDL(t){
  if(t.kind==="enum") return `enum ${t.name} {\n${(t.values||[]).map(v=>"  "+v).join("\n")}\n}`;
  const body=(t.fields||[]).map(f=>`  ${f.name}: ${f.type}`).join("\n");
  if(t.kind==="input") return `input ${t.name} {\n${body}\n}`;
  // borrowed entity from another subgraph: reference stub (resolvable:false) or field-contributing extend
  if(t.ext){ const key=t.key||keyOf(t.fields);
    return `${t.ext.mode==="extend"?"extend type":"type"} ${t.name} @key(fields: "${key}"${t.ext.mode==="reference"?", resolvable: false":""}) {\n${body}\n}`; }
  if(t.isEntity) return `type ${t.name} @key(fields: "${t.key||keyOf(t.fields)}") {\n${body}\n}`;
  return `type ${t.name} {\n${body}\n}`;
}
// registry Schema.Definition body (no leading `type Name`), matching GQLRegistry.xlsx
function typeDefBody(t){
  if(t.kind==="enum") return `{\n${(t.values||[]).map(v=>"  "+v).join("\n")}\n}`;
  const body=(t.fields||[]).map(f=>`  ${f.name}: ${f.type}`).join("\n");
  if(t.ext){ const key=t.key||keyOf(t.fields);
    const prefix = `@key(fields: "${key}"${t.ext.mode==="reference"?", resolvable: false":""}) `;
    return `${prefix}{\n${body}\n}`; }   // Kind column (Reference/Extend) distinguishes the two on reload
  const prefix = t.isEntity ? `@key(fields: "${t.key||keyOf(t.fields)}") ` : "";
  return `${prefix}{\n${body}\n}`;
}
function opSig(o){
  const args=(o.args&&o.args.length) ? "("+o.args.map(a=>`${a.name}: ${a.type}`).join(", ")+")" : "";
  return `${o.name}${args}: ${o.returns||"Boolean"}`;
}
function subgraphSDL(sg){
  const parts=[];
  const order=[sg.types.filter(t=>t.kind==="enum"&&!t.ext), sg.types.filter(t=>t.kind==="input"&&!t.ext),
               sg.types.filter(t=>t.kind==="type"&&!t.isEntity&&!t.ext), sg.types.filter(t=>t.kind==="type"&&t.isEntity&&!t.ext),
               sg.types.filter(t=>t.ext&&t.ext.mode==="reference"), sg.types.filter(t=>t.ext&&t.ext.mode==="extend")];
  for(const grp of order) for(const t of grp) parts.push(typeSDL(t));
  const q=sg.ops.filter(o=>o.opKind==="query"), m=sg.ops.filter(o=>o.opKind==="mutation");
  if(q.length) parts.push(`type Query {\n${q.map(o=>"  "+opSig(o)).join("\n")}\n}`);
  if(m.length) parts.push(`type Mutation {\n${m.map(o=>"  "+opSig(o)).join("\n")}\n}`);
  return parts.join("\n\n");
}
/* --------- borrowed entities (federation @key reference / extend) -------- */
function lowerCamel(s){ s=String(s||""); return s.charAt(0).toLowerCase()+s.slice(1); }
// The type object for an entity owned (@key, not borrowed) by a subgraph other than sg.
function findOwningEntity(sg, name){
  for(const other of mapping.subgraphs){ if(other.id===sg.id) continue;
    const t=(other.types||[]).find(t=>t.name===name && t.isEntity && !t.ext); if(t) return {type:t, sg:other}; }
  return null;
}
// Entities owned by OTHER subgraphs → {name, ownerSg, key}. Candidates to borrow/extend.
function otherSubgraphEntities(sg){
  const out=[], seen=new Set();
  for(const other of mapping.subgraphs){ if(other.id===sg.id) continue;
    for(const t of (other.types||[])){ if(t.isEntity && !t.ext && !seen.has(t.name)){
      seen.add(t.name); out.push({name:t.name, ownerSg:other.name, key:t.key||keyOf(t.fields)}); } } }
  return out;
}
// External entity names referenced by sg's field/op types but not defined or already borrowed here.
function externalTypeSuggestions(sg){
  const defined=new Set((sg.types||[]).map(t=>t.name));
  const referenced=new Set();
  for(const t of (sg.types||[])){ if(t.ext) continue; for(const f of (t.fields||[])) referenced.add(baseType(f.type)); }
  for(const o of (sg.ops||[])){ for(const a of (o.args||[])) referenced.add(baseType(a.type)); if(o.returns) referenced.add(baseType(o.returns)); }
  return otherSubgraphEntities(sg).filter(e=>referenced.has(e.name) && !defined.has(e.name));
}
function addEntityBorrow(sgId, opts){
  const sg=mapping.subgraphs.find(s=>s.id===sgId); if(!sg) return;
  opts=opts||{};
  const name=String(opts.name||"").trim(); if(!name){ alert("Entity name is required."); return; }
  if((sg.types||[]).some(t=>t.name===name)){ alert(`"${name}" is already defined or borrowed in this subgraph.`); return; }
  const mode=opts.mode==="extend"?"extend":"reference";
  const owner=findOwningEntity(sg, name);
  const key=String(opts.key||"").trim() || (owner?(owner.type.key||keyOf(owner.type.fields)):"id");
  const keyNames=key.split(/\s+/).filter(Boolean);
  const keyType=(k)=>{ const of=owner && (owner.type.fields||[]).find(f=>f.name===k); return of?of.type.replace(/\s*@\w+.*$/,"").trim():"ID!"; };
  const fields=keyNames.map(k=>({ name:k, type: keyType(k)+(mode==="extend"?" @external":"") }));
  if(mode==="extend"){
    const fn=String(opts.fieldName||"").trim(), ft=String(opts.fieldType||"").trim();
    if(fn && ft) fields.push({name:fn, type:ft});
  }
  (sg.types=sg.types||[]).push({ name, kind:"type", isEntity:true, key, fields, values:[], ext:{mode} });
  persist(); afterLoad(); toast(`${mode==="extend"?"Extended":"Referenced"} ${name} from another subgraph`);
}
function removeEntityBorrow(sgId, name){
  const sg=mapping.subgraphs.find(s=>s.id===sgId); if(!sg) return;
  sg.types=(sg.types||[]).filter(t=>!(t.name===name && t.ext));
  persist(); afterLoad(); toast(`Removed borrowed ${name}`);
}

const TYPE_KINDS = new Set(["type","input","interface","enum","union","scalar"]);
function assignKeyForItem(it){ return it.kind==="root" ? it.root+":"+it.name : it.kind+":"+it.name; }
function assignEntries(){
  return Object.entries(mapping.assign).map(([key,v])=>({ key, kind:key.slice(0,key.indexOf(":")), name:key.slice(key.indexOf(":")+1), domain:v.domain||"", entity:v.entity||"" }));
}
function targetDomains(){
  const s=new Set();
  for(const e of state.entities) if(e.BusinessApplication) s.add(String(e.BusinessApplication));
  for(const a of assignEntries()) if(a.domain) s.add(a.domain);
  for(const sg of mapping.subgraphs) if(sg.name) s.add(sg.name);
  for(const d of mapping.customDomains) if(d) s.add(d);
  return [...s].sort();
}
function targetEntityNames(){
  const s=new Set(state.entities.map(e=>String(e.Name)));
  for(const a of assignEntries()) if(a.entity) s.add(a.entity);
  for(const sg of mapping.subgraphs) for(const t of sg.types) if(t.name) s.add(t.name);
  return [...s].sort();
}

/* ----------------------------- loading --------------------------------- */
function persist(){ try{ localStorage.setItem(LS, JSON.stringify({monographText:state.monographText, entities:state.entities, schema:state.schema, reg:state.reg, regHeaders:state.regHeaders, regOrder:state.regOrder, mapping})); }catch(e){} }
function migrateMapping(m){
  m=Object.assign(defaultMapping(), m||{});
  m.subgraphs=(m.subgraphs||[]).map(sg=>Object.assign({id:uid(),name:"subgraph",spec:"",ops:[],types:[]}, sg));
  // back-compat: fold a legacy flat `rest` array into subgraphs grouped by domain
  if(Array.isArray(m.rest) && m.rest.length){
    const byDom={};
    for(const r of m.rest){ const d=r.domain||"legacy"; (byDom[d]=byDom[d]||[]).push(r); }
    for(const [d, arr] of Object.entries(byDom)){
      const types=[]; const seen=new Set();
      const ops=arr.map(r=>{ const tn=r.entity||cap(r.name||"Response");
        if(r.fields && r.fields.length && !seen.has(tn)){ seen.add(tn); const k=entityKey(tn, r.fields); types.push({name:tn, kind:"type", isEntity:!!k, key:k, fields:r.fields, values:[]}); }
        return {id:r.id||uid(), name:r.name, method:r.method||"GET", path:r.path||"", opKind:r.opKind||(r.method==="GET"?"query":"mutation"), args:r.args||[], returns:(r.fields&&r.fields.length)?tn:"Boolean", entity:r.entity||"", notes:r.notes||""}; });
      m.subgraphs.push({id:uid(), name:d, spec:"(migrated)", ops, types});
    }
  }
  delete m.rest;
  return m;
}
function restore(){
  const raw = localStorage.getItem(LS) || localStorage.getItem("gqlmig-v1"); if(!raw) return;
  try{ const d=JSON.parse(raw);
    state.entities=d.entities||[]; state.schema=d.schema||[];
    state.reg=d.reg||{}; state.regHeaders=d.regHeaders||{}; state.regOrder=d.regOrder||Object.keys(state.reg);
    if(state.reg.Entities) state.entities=state.reg.Entities;
    if(d.mapping) mapping=migrateMapping(d.mapping);
    if(d.monographText){ state.monographText=d.monographText; state.monograph=parseSDL(d.monographText); }
  }catch(e){}
}
// sheetRows → common.js

function loadRegWB(wb){
  state.reg={}; state.regHeaders={}; state.regOrder=[...wb.SheetNames];   // every sheet is kept so a merged registry can be saved whole
  for(const s of wb.SheetNames){
    if(!wb.Sheets[s]) continue;
    state.reg[s]=sheetRows(wb,s);
    state.regHeaders[s]=(XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1})[0]||[]).map(String);
  }
  state.entities=state.reg.Entities||[]; state.schema=state.reg.Schema||[];
}
// Reverse of typeDefBody(): rebuild a subgraph type from an exported Schema.Definition body
// (also tolerates a full "type Name … { }" definition). Kind is the sheet's Key/Type/Input/Enum.
function parseSubgraphDef(kind, name, def){
  def=String(def||"").trim(); const k=String(kind||"").toLowerCase();
  let inner=stripDescriptions((def.match(/\{([\s\S]*)\}/)||[,""])[1]);
  if(k==="enum" && !/\{/.test(def)) inner=stripDescriptions(def);   // registry enums store bare values
  if(k==="enum"){
    const values=inner.split(/\r?\n/).map(s=>s.replace(/,$/,"").trim()).filter(Boolean);
    return { name, kind:"enum", isEntity:false, key:"", fields:[], values, raw:"" };
  }
  // borrowed entity from another subgraph: Kind Reference/Extend (or the raw def gives it away)
  const extMode = k==="reference" ? "reference" : (k==="extend" ? "extend"
                : (/^extend\s+type/.test(def) ? "extend" : (/resolvable:\s*false/.test(def) ? "reference" : "")));
  const isEntity = k==="key" || !!extMode || /@key/.test(def);
  const keyM = def.match(/@key\(fields:\s*"([^"]*)"\)/);
  const fields=inner.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(line=>{
    const m=line.match(/^([A-Za-z_]\w*)\s*:\s*(.+?),?$/); return m?{name:m[1], type:m[2].trim()}:null;
  }).filter(Boolean);
  const kind2 = k==="input" ? "input" : (k==="interface" ? "interface" : "type");
  const t={ name, kind:kind2, isEntity, key:keyM?keyM[1]:(isEntity?keyOf(fields):""), fields, values:[], raw:"" };
  if(extMode) t.ext={mode:extMode};
  return t;
}
// Load a previously exported "…-subgraph.xlsx" (Entities/Schema/Queries/Mutations) back into a
// subgraph so an in-progress migration can be resumed and re-exported.
function loadSubgraphMigrationWB(wb, fileName){
  const schema=sheetRows(wb,"Schema"), queries=sheetRows(wb,"Queries"), muts=sheetRows(wb,"Mutations"), ents=sheetRows(wb,"Entities");
  if(!schema.length && !queries.length && !muts.length)
    throw new Error("No Schema/Queries/Mutations rows found — is this a subgraph migration export?");

  const types=schema.map(r=>parseSubgraphDef(r.Kind, r.TypeName, r.Definition)).filter(t=>t&&t.name);
  const opFrom=(r,opKind)=>{
    const ref=(linkValues(r.Links,"REST")[0]||"").trim(), mm=ref.match(/^(\S+)\s+(.*)$/);   // REST line in Links & References
    return { id:uid(), name:r.Name, args:parseArgs(r.Parameters), returns:r.ReturnType||"",
      opKind, method:mm?mm[1]:"", path:mm?(mm[2]||"").trim():"", entity:baseType(r.ReturnType||""), notes:"" };
  };
  const ops=queries.map(r=>opFrom(r,"query")).concat(muts.map(r=>opFrom(r,"mutation")));

  // Subgraph name from the export filename ("offers-subgraph.xlsx" → "offers"), else an entity hint.
  let name=String(fileName||"").replace(/\.xlsx$/i,"").replace(/-subgraph$/i,"").trim();
  if(!name) name=(ents[0]&&(ents[0].BusinessApplication||ents[0].Name))||"subgraph";

  // Merge into an existing subgraph of the same name, or add a new one.
  let sg=mapping.subgraphs.find(s=>s.name===name);
  if(sg){ sg.types=types; sg.ops=ops; sg.spec=fileName||sg.spec; }
  else { sg={ id:uid(), name, spec:fileName||"(loaded from xls)", types, ops }; mapping.subgraphs.push(sg); }
  selRest=sg.id;

  // Restore per-entity domain metadata (EntityID + domain cols) so re-export reproduces the rows,
  // and focus the migration on the primary entity (matching the registry entity when present).
  let focusName="", focusEntId="";
  for(const t of types.filter(t=>t.isEntity)){
    const er=ents.find(e=>String(e.Name||"")===t.name); if(!er) continue;
    const meta=(mapping.entityMeta[entityMetaKey(sg.id,t.name)]=mapping.entityMeta[entityMetaKey(sg.id,t.name)]||{});
    for(const c of DOMAIN_COLS){ if(er[c.f]!=null && String(er[c.f])!=="") meta[c.f]=String(er[c.f]); }
    if(!focusName){ focusName=t.name; focusEntId=String(er.EntityID||""); }
  }
  if(!focusName) focusName=ensureEntity(sg);                  // no entity row → promote/create one
  mapping.focusEntity=entityMetaKey(sg.id, focusName);
  if(focusEntId && (state.entities||[]).some(r=>String(r.EntityID||"")===focusEntId)) mapping.migrationEntityId=focusEntId;
  return { sg, types:types.length, ops:ops.length, entity:focusName };
}
function loadmonographText(txt){ state.monographText=txt; state.monograph=parseSDL(txt); }

function onFile(input, kind){
  const file=input.files[0]; if(!file) return; const r=new FileReader();
  if(kind==="monograph"){ r.onload=e=>{ loadmonographText(e.target.result); afterLoad(); }; r.readAsText(file); }
  else if(kind==="sgmig"){
    r.onload=e=>{ try{ const wb=XLSX.read(e.target.result,{type:"array"}); const res=loadSubgraphMigrationWB(wb, file.name); afterLoad();
        toast(`Loaded subgraph "${res.sg.name}" — ${res.types} types, ${res.ops} ops`); }
      catch(err){ alert(err.message||"Could not read this subgraph migration xls."); } };
    r.readAsArrayBuffer(file); input.value="";
  }
  else { r.onload=e=>{ const wb=XLSX.read(e.target.result,{type:"array"}); loadRegWB(wb); afterLoad(); }; r.readAsArrayBuffer(file); }
}
async function tryAutoFetch(){
  const jobs = [
    ["reg", ["GQLRegistry.xlsx","../documents/GQLRegistry.xlsx"]],
    ["monograph", ["subgraphs/monograph/schema.graphqls","subgraphs/monograph/schema.graphqls"]],
  ];
  let any=false;
  for(const [kind, urls] of jobs){
    if(kind==="reg" && state.entities.length) continue;
    if(kind==="monograph" && state.monographText) continue;
    for(const url of urls){
      try{
        const res=await fetch(url); if(!res.ok) continue;
        if(kind==="monograph") loadmonographText(await res.text());
        else { const wb=XLSX.read(await res.arrayBuffer(),{type:"array"}); loadRegWB(wb); }
        any=true; break;
      }catch(e){ /* file:// or missing — ignore */ }
    }
  }
  if(any) afterLoad();
}

/* ----------------------- migration-status tags ------------------------- */
function statusTag(s){
  const v=String(s||"").toLowerCase(); let cls="tbc";
  if(v.includes("platform")) cls="plat";
  else if(v.includes("on fed")) cls="on";
  else if(v.includes("bff")) cls="bff";
  else if(v.includes("not on")) cls="off";
  return `<span class="tag ${cls}">${esc(s||"TBC")}</span>`;
}

function entityMetaKey(sgId, typeName){ return sgId+"::"+typeName; }
function keyEntities(){
  const list=[];

/* ---------------------------- MonoGraph schema ------------------------- */
function monographItems(){
  if(!state.monograph) return [];
  const items=[];
  for(const k of ["Query","Mutation","Subscription"]) for(const f of state.monograph.roots[k]) items.push({group:k+" fields", kind:"root", root:k, name:f.name, f});
  const byKind={type:"Types", input:"Inputs", enum:"Enums", interface:"Interfaces", union:"Unions", scalar:"Scalars"};
  for(const kk of Object.keys(byKind)) for(const t of state.monograph.types.filter(t=>t.kind===kk)) items.push({group:byKind[kk], kind:t.kind, name:t.name, t});
  return items;
}
function rendermonographList(){
  const host=document.getElementById("monographList"); if(!host) return;
  if(!state.monograph){ host.innerHTML='<div class="empty">Load the MonoGraph schema.</div>'; return; }
  const query=(val("monographFilter")||"").toLowerCase();
  const items=monographItems().filter(it=>it.name.toLowerCase().includes(query));
  const order=["Query fields","Mutation fields","Subscription fields","Types","Inputs","Interfaces","Enums","Unions","Scalars"];
  let html="";
  for(const g of order){
    const gi=items.filter(it=>it.group===g); if(!gi.length) continue;
    html+=`<div class="grp">${g} · ${gi.length}</div>`;
    html+=gi.map(it=>{ const key=it.group+"|"+it.name; const a=mapping.assign[assignKeyForItem(it)];
      const badge=a?` <span class="badge">→ ${esc(a.domain)}${a.entity?"/"+esc(a.entity):""}</span>`:"";
      return `<div class="item ${key===selmonograph?"active":""}" onclick="selectmonograph(${q(key)})"><span class="mono">${esc(it.name)}</span>${badge}</div>`;
    }).join("");
  }
  host.innerHTML = html || '<div class="empty">No matches.</div>';
}

/* ------------------------- Subgraphs (OpenAPI) ------------------------- */
// Guarantee the subgraph exposes at least one @key entity (the migration target) and return its name.
function ensureEntity(sg){
  let ent=sg.types.find(t=>t.isEntity);
  if(!ent){
    ent=sg.types.find(t=>t.kind==="type");                  // an object type — never an enum/input
    if(!ent){                                               // spec had no object schemas (ops only, or just enums)
      const nm=cap((sg.name||"entity").replace(/[^A-Za-z0-9]/g,""))||"Entity";
      ent={ name:nm, kind:"type", isEntity:true, key:"id", fields:[{name:"id", type:"ID!"}], values:[], raw:"" };
      sg.types.unshift(ent);
    } else {                                                // promote that object type into a @key entity
      ent.isEntity=true;
      if(!ent.key) ent.key=(ent.fields||[]).some(f=>f.name==="id") ? "id" : (((ent.fields||[])[0]||{}).name||"id");
    }
  }
  return ent.name;
}
function importOpenAPI(file){
  const r=new FileReader();
  r.onload=e=>{ try{
    const stem=(file.name||"spec").replace(/\.(json|ya?ml|txt)$/i,"");
    let defName=stem;
    try{ const j=(file.name||"").match(/\.ya?ml$/i)?jsyaml.load(e.target.result):JSON.parse(e.target.result); if(j&&j.info&&j.info.title) defName=slug(j.info.title).toLowerCase().replace(/ /g,"-"); }catch(_){}
    let sgName=prompt("Subgraph / platform name for this spec:", defName); if(sgName===null) return; sgName=sgName.trim()||defName;
    importOpenAPIText(e.target.result, file.name||"", sgName);
  }catch(err){ alert(err.message||"Failed to parse OpenAPI spec."); } };
  r.readAsText(file);
}
// Import one OpenAPI spec (text) as subgraph `sgName` and focus the migration on its entity.
function importOpenAPIText(text, fileName, sgName){
    const sg=parseOpenAPI(text, sgName); sg.spec=fileName||"";
    if(!sg.ops.length && !sg.types.length){ alert("No operations or component schemas found in that spec."); return; }
    const existing=mapping.subgraphs.find(s=>s.name===sgName);
    let target;
    if(existing){ existing.types=sg.types; existing.ops=sg.ops; existing.spec=sg.spec; selRest=existing.id; target=existing; }
    else { mapping.subgraphs.push(sg); selRest=sg.id; target=sg; }
    const entName=ensureEntity(target);                      // guarantee an @key entity to migrate
    mapping.focusEntity=target.id+"::"+entName;              // focus the migration on it
    applyRegistryToFocus();                                  // map it onto the chosen GQL Registry entity
    persist(); afterLoad();
    const os=document.getElementById("openapiState"); if(os) os.textContent=`imported "${sgName}" — ${sg.types.length} types, ${sg.ops.length} ops`;
    toast(`Imported subgraph ${sgName}`);
}

async function fetchSample(path, kind){

function saveSubgraph(){ const sg=mapping.subgraphs.find(x=>x.id===selRest); if(!sg) return; const nm=val("sgName").trim(); if(nm) sg.name=nm; persist(); afterLoad(); toast("Saved"); }
function deleteSubgraph(){ mapping.subgraphs=mapping.subgraphs.filter(x=>x.id!==selRest); selRest=null; persist(); afterLoad(); toast("Deleted"); }
function toggleOpKind(id){ const sg=mapping.subgraphs.find(x=>x.id===selRest); if(!sg) return; const o=sg.ops.find(o=>o.id===id); if(o){ o.opKind=o.opKind==="query"?"mutation":"query"; persist(); renderRestDetail(); renderCurrentSubgraph(); } }
function deleteOp(id){ const sg=mapping.subgraphs.find(x=>x.id===selRest); if(!sg) return; sg.ops=sg.ops.filter(o=>o.id!==id); persist(); renderRestDetail(); renderCurrentSubgraph(); toast("Op removed"); }

/* ---------------------------- Excel write-back ------------------------- */
function maxNum(rows, idKey, prefix){ let mx=0; const re=new RegExp("^"+prefix+"-0*(\\d+)"); for(const r of (rows||[])){ const m=String(r[idKey]||"").match(re); if(m) mx=Math.max(mx,+m[1]); } return mx; }
function pad3(n){ return String(n).padStart(3,"0"); }
// Build registry-shaped rows ({Entities,Schema,Queries,Mutations}) for one subgraph.
// The entity is ENT-### (user-set or minted); its children embed that id as
// SCH-/QRY-/MUT-<EntityID>-<seq> and FK back to it. When a focus entity is set every
// row is owned by that one entity; the xls export seeds the ENT counter from any loaded registry.
// The single entity this migration focuses on (type name) if it lives in `sg`, else null.
function focusFor(sg){
  const fk=mapping.focusEntity||""; if(!fk) return null;
  const i=fk.indexOf("::"); const sid=fk.slice(0,i), tn=fk.slice(i+2);
  return sid===sg.id ? tn : null;
}
// The subgraph being migrated: the one owning the selected migration entity (falls back to the
// subgraph selected on the Subgraphs tab). Drives Export / Copy so they follow the chosen ENT.
function migrationSubgraph(){
  const fk=mapping.focusEntity||"";
  if(fk){ const sid=fk.slice(0, fk.indexOf("::")); const sg=mapping.subgraphs.find(s=>s.id===sid); if(sg) return sg; }
  return mapping.subgraphs.find(x=>x.id===selRest) || null;
}
// Type names to keep when scoped to a focus entity: the focus entity itself plus every
// supporting type/enum/input in the subgraph. Other @key entities are excluded — each of
// those migrates on its own. This keeps all the schema types the entity's subgraph needs.
function relatedTypeNames(sg, focusTN){
  const keep=new Set();
  for(const t of sg.types){
    if(t.name===focusTN) keep.add(t.name);                  // the focus entity
    else if(!t.isEntity) keep.add(t.name);                  // types, enums, inputs — the supporting schema
    else if(t.ext) keep.add(t.name);                        // borrowed entities (reference/extend) travel with it

  // Entity id everything hangs off when focused (matches the entity row's own id).

    else { if(mExist.has(o.name)) continue; out.Mutations.push({ MutationID:cid("MUT", eid), EntityID:eid, Name:o.name, Parameters:args, ReturnType:o.returns||"", Description:note, ApprovalStatus:"Draft", Links:link }); mExist.add(o.name); }

  if(!sg){ alert("Pick the GQL Registry entity to migrate on the Load data tab first."); return; }
  if(!sg.types.length && !sg.ops.length){ alert("This subgraph has no types or operations to export yet."); return; }
  const vcheck=validateSubgraphRows(buildSubgraphRows(sg));
  if(vcheck.errors.length){
    alert("This subgraph does not meet the FedGQL schema standards.\n\n"+vcheck.errors.length+" error"+(vcheck.errors.length>1?"s":"")+" must be fixed on the FedGQL subgraph tab before exporting:\n\n"+summarizeViolations(vcheck.errors)+"\n\nSee the highlighted cells and the issues panel on the FedGQL subgraph tab.");
    if(window.wzGo) wzGo(4);
    return;
  }
  if(vcheck.warnings.length && !confirm(vcheck.warnings.length+" FedGQL standards warning"+(vcheck.warnings.length>1?"s":"")+" (export is allowed, but review these):\n\n"+summarizeViolations(vcheck.warnings)+"\n\nExport anyway?")) { if(window.wzGo) wzGo(4); return; }
  if(!confirm("Make sure EntityIDs (ENT-XXX) in this migration match GQLRegistry.xlsx before continuing.\n\nProceed?")) return;

  // Seed ID counters from any loaded registry so new rows continue cleanly.
  const reg = state.reg || {};
  const out = buildSubgraphRows(sg, { ENT:maxNum(reg.Entities,"EntityID","ENT"), SCH:maxNum(reg.Schema,"SchemaID","SCH"),
    QRY:maxNum(reg.Queries,"QueryID","QRY"), MUT:maxNum(reg.Mutations,"MutationID","MUT") });

  const wb=XLSX.utils.book_new();
  for(const s of ["Entities","Schema","Queries","Mutations"]){
    const headers=(state.regHeaders[s] && state.regHeaders[s].length) ? state.regHeaders[s] : (CANON_HEADERS[s] || Object.keys(out[s][0]||{}));
    const aoa=[headers, ...out[s].map(row=>headers.map(h=>row[h]!=null?row[h]:""))];
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=headers.map(h=>({wch:Math.max(12,String(h).length+2)}));
    XLSX.utils.book_append_sheet(wb, ws, s);
  }
  const fname=String(sg.name||"subgraph").replace(/[^a-zA-Z0-9_-]+/g,"-")+"-subgraph.xlsx";
  XLSX.writeFile(wb, fname); toast("Exported "+fname);
}

/* ------------- FedGQL schema standards & validation (ported from workbench.html) -------------
   Enforces the "GQL Federation — Schema Standards and Patterns" doc so rows are validated
   here BEFORE they are copied / exported to the GQL Registry. Kept in sync with workbench.html. */
// FedGQL standards engine (DEFAULT_STANDARDS, VALIDATED_SHEETS, validateRow, worstSeverity, …) → common.js
// Validate a whole buildSubgraphRows() result. Returns per-row map + severity-bucketed lists.
function validateSubgraphRows(rows){
  const all=[], byRow={}, ctx=buildStandardsContext(rows);   // cross-row rules: unused types, enum usage, composition
  for(const sheet of VALIDATED_SHEETS){
    byRow[sheet]={};
    for(const row of (rows[sheet]||[])){
      const v=validateRow(sheet,row,ctx); if(!v.length) continue;
      const id=row[OV_ID[sheet]]; byRow[sheet][id]=v;
      for(const x of v) all.push(Object.assign({ sheet, rowId:id }, x));
    }
  }
  return { all, byRow,
    errors:all.filter(v=>v.severity==="error"),
    warnings:all.filter(v=>v.severity==="warning"),
    infos:all.filter(v=>v.severity==="info") };
}
// Compact text summary for confirm()/alert() gates.
function summarizeViolations(list, max){
  max=max||10; const shown=list.slice(0,max)
    .map(v=>`• [${v.ruleId}] ${v.sheet}${v.subject?" "+v.subject.trim():""} — ${v.message}`).join("\n");
  return shown + (list.length>max ? `\n… and ${list.length-max} more` : "");
}
// Summary line (class + head text) for the standards banner at the top of the FedGQL subgraph tab.
function stdSummaryParts(v){
  const cls = v.errors.length ? "err" : (v.warnings.length||v.infos.length) ? "warn" : "ok";
  const head = v.errors.length
    ? `<b style="color:#b91c1c">✖ ${v.errors.length} error${v.errors.length>1?"s":""} must be fixed before copying to the GQL Registry</b> <span class="hint">— see the flagged rows below</span>`
    : (v.warnings.length||v.infos.length)
      ? `<b style="color:#b45309">⚠ ${v.warnings.length} warning${v.warnings.length===1?"":"s"} · ${v.infos.length} suggestion${v.infos.length===1?"":"s"}</b> <span class="hint">— shown under the affected rows; copy is allowed after confirming</span>`
      : `<b style="color:#15803d">✓ All rows pass the FedGQL schema standards</b>`;
  return { cls, head };
}
// Top banner (live-updated by updateStdSummary) + the reference list of enforced standards.
function standardsPanelHTML(v){
  const { cls, head } = stdSummaryParts(v);
  const rules=(STANDARDS.rules||[]).filter(isLocalRule);
  const ext=(STANDARDS.rules||[]).filter(r=>r.enabled!==false&&!isLocalRule(r)).length;
  const ref=`<details class="stdref"><summary>FedGQL standards enforced (${rules.length} rules — from ${esc((STANDARDS.meta||{}).title||"schema standards")} + Apollo GraphOS linter${ext?`; ${ext} more checked by GraphOS on publish`:""})</summary>
    <ul>${rules.map(r=>`<li><span class="sev ${esc(r.severity)}">${esc(r.severity)}</span><b>${esc(r.title)}</b>${apolloIds(r).length?` <span class="mono">${esc(apolloIds(r).join(", "))}</span>`:""} — ${esc(r.message)}</li>`).join("")}</ul></details>`;
  return `<div id="stdSummary" class="stdpanel ${cls}">${head}</div>${ref}`;
}
// Re-point the top banner class/text after a live revalidation.
function updateStdSummary(v){
  const el=document.getElementById("stdSummary"); if(!el) return;
  const { cls, head } = stdSummaryParts(v);
  el.className="stdpanel "+cls; el.innerHTML=head;
}
// Worst severity per column for a row's violations.
function violByCol(viols){ const m={}; for(const v of viols){ const r=SEVERITY_RANK[v.severity]||0; if(!m[v.col]||r>(SEVERITY_RANK[m[v.col]]||0)) m[v.col]=v.severity; } return m; }
// Inline assertion block rendered directly under an offending row.
function rowViolInner(viols){
  const order=[...viols].sort((a,b)=>(SEVERITY_RANK[b.severity]||0)-(SEVERITY_RANK[a.severity]||0));
  return `<div class="rowviol-in">`+order.map(v=>
    `<div class="rvi"><span class="sev ${esc(v.severity)}">${esc(v.severity)}</span>${v.subject?`<span class="mono">${esc(v.subject.trim())}</span> `:""}${esc(v.message)} <span class="fix">— ${esc(v.fix||"")}</span>${v.doc?` <a href="${esc(v.doc)}" target="_blank" rel="noopener">doc↗</a>`:""}</div>`
  ).join("")+`</div>`;
}
// After an edit, re-run the standards for just the changed row and repaint its cells + inline block.
function revalidateRow(sheet, id){
  const sg=migrationSubgraph(); if(!sg) return;
  const rows=buildSubgraphRows(sg);
  updateStdSummary(validateSubgraphRows(rows));                 // keep the top banner counts live
  const row=(rows[sheet]||[]).find(r=>r[OV_ID[sheet]]===id);
  applyRowValidation(sheet, id, row?validateRow(sheet,row,buildStandardsContext(rows)):[]);
}
function applyRowValidation(sheet, id, viols){
  const dataRow=document.getElementById("row-"+sheet+"-"+id); if(!dataRow) return;
  const byCol=violByCol(viols);
  for(const td of dataRow.querySelectorAll("td")){
    const k=td.getAttribute("data-k"); if(!k) continue;
    td.classList.remove("cell-invalid","cell-warn"); td.removeAttribute("title");
    const sev=byCol[k]; if(!sev) continue;
    td.classList.add(sev==="error"?"cell-invalid":"cell-warn");
    td.title=viols.filter(v=>v.col===k).map(v=>"["+v.severity+"] "+v.message).join(" — ");
  }
  let vr=document.getElementById("viol-"+sheet+"-"+id);
  if(viols.length){
    if(!vr){ vr=document.createElement("tr"); vr.id="viol-"+sheet+"-"+id; dataRow.parentNode.insertBefore(vr, dataRow.nextSibling); }
    vr.className="rowviol "+(worstSeverity(viols)==="error"?"error":"warn");
    const cols=parseInt(dataRow.getAttribute("data-cols"),10)||1;
    vr.innerHTML=`<td colspan="${cols}">${rowViolInner(viols)}</td>`;
  } else if(vr){ vr.remove(); }
}

/* --------------------- FedGQL subgraph + copy to registry ------------- */
// The editable rows render into the Onboarding guide's review step while it is on screen, otherwise into
// the FedGQL subgraph tab; the other host is cleared so element ids (row-…, stdSummary) stay unique.
function curSgHost(){
  const g=document.getElementById("wzCurSg"), e=document.getElementById("curSg");
  const useG=!!g;   // the guide's review step hosts the editor whenever it is on screen
  const other=useG?e:g; if(other) other.innerHTML=useG?'<div class="empty">This subgraph is open in the <b>Onboarding guide</b> (step 5).</div>':"";
  return useG?g:e;
}
function renderCurrentSubgraph(){
  const host=curSgHost(); if(!host) return;
  const sg=migrationSubgraph();                             // same source of truth as Code migration
  if(!sg){ host.innerHTML='<div class="empty">Pick a GQL Registry entity to migrate on the <b>Load data</b> tab, then import its OpenAPI/Swagger spec.</div>'; return; }
  const rows=buildSubgraphRows(sg);
  const val=validateSubgraphRows(rows);                    // FedGQL schema-standards check
  const sgAdds=(mapping.additions||{})[sg.id]||{};         // user-added rows get a remove control on their id cell
  const addedIds={ Schema:new Set((sgAdds.Schema||[]).map(r=>String(r.SchemaID))),
    Queries:new Set((sgAdds.Queries||[]).map(r=>String(r.QueryID))),
    Mutations:new Set((sgAdds.Mutations||[]).map(r=>String(r.MutationID))) };
  const focusTN=focusFor(sg);
  const focusNote = focusTN ? ` · focused on <span class="mono">${esc(focusTN)}</span>` : ` · <span class="hint">pick a migration entity on Load data to focus</span>`;
  const APPROVALS=["Draft","Proposed","Approved","Deprecated"];
  // Highlight class for a cell: worst severity of the violations on this row that target column c.k.
  const cellFlag=(sheet,id,k)=>{
    const vs=(val.byRow[sheet]||{})[id]; if(!vs) return "";
    const hit=vs.filter(v=>v.col===k); if(!hit.length) return "";
    const w=worstSeverity(hit); return w==="error"?" cell-invalid":" cell-warn";
  };
  const cellTitle=(sheet,id,k)=>{
    const vs=(val.byRow[sheet]||{})[id]; if(!vs) return "";
    const hit=vs.filter(v=>v.col===k); if(!hit.length) return "";
    return ` title="${esc(hit.map(v=>"["+v.severity+"] "+v.message).join(" — "))}"`;
  };
  // Editable cell (inline mode — Entities): read-only for id/FK columns, inputs for edit columns.
  const cell=(sheet,r,c)=>{
    const id=r[OV_ID[sheet]], v=r[c.k]!=null?r[c.k]:"";
    const flag=cellFlag(sheet,id,c.k), tip=cellTitle(sheet,id,c.k), dk=`data-k="${esc(c.k)}"`;
    if(!c.edit && !c.sel){
      const rm=(c.k===OV_ID[sheet] && addedIds[sheet] && addedIds[sheet].has(String(id)))
        ? ` <button class="rm-row" title="Remove this added row" onclick="removeAddedRow(${q(sheet)},${q(id)})">✕</button>` : "";
      return `<td ${dk} class="${c.mono?"mono":""}${flag}"${tip}>${esc(v)}${rm}</td>`;
    }
    if(c.links) return `<td ${dk} data-sheet="${esc(sheet)}" data-id="${esc(id)}" class="${flag.trim()}"${tip}>${parseLinks(v).map(linkLineHTML).join("")}<button class="addrow" onclick="addLinkLine(this)">＋ link</button></td>`;
    const oc=`onchange="setRowOverride(${q(sheet)},${q(id)},${q(c.k)},this.value)"`;
    if(c.sel){ const opts=(c.sel.includes(v)?c.sel:[v,...c.sel]).map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join(""); return `<td ${dk} class="${flag.trim()}"${tip}><select class="cell" ${oc}>${opts}</select></td>`; }
    if(c.ta) return `<td ${dk} class="${flag.trim()}"${tip}><textarea class="cell" rows="2" ${oc}>${esc(v)}</textarea></td>`;
    return `<td ${dk} class="${flag.trim()}"${tip}><input class="cell${c.mono?" mono":""}" value="${esc(v)}" ${oc}></td>`;
  };
  // Read-only display cell (editable mode — Schema/Queries/Mutations): shown until Edit is clicked.
  const roCell=(sheet,r,c)=>{
    const id=r[OV_ID[sheet]], v=r[c.k]!=null?String(r[c.k]):"";
    const flag=cellFlag(sheet,id,c.k), tip=cellTitle(sheet,id,c.k), dk=`data-k="${esc(c.k)}"`;
    let inner;
    if(c.links) inner=linksHTML(v)||'<span class="hint">—</span>';
    else if(c.ta) inner=v?`<span class="ro-pre">${esc(v)}</span>`:'<span class="hint">—</span>';
    else inner=v!==""?esc(v):'<span class="hint">—</span>';
    return `<td ${dk} class="ro ${c.mono?"mono":""}${flag}"${tip}>${inner}</td>`;
  };
  // One labeled field inside the expanded edit panel.
  // ID cell with the ✎ edit button next to it (editable mode — opens the dialog); ✕ removes added rows.
  const idCell=(sheet,r,c)=>{
    const id=r[OV_ID[sheet]], flag=cellFlag(sheet,id,c.k), tip=cellTitle(sheet,id,c.k);
    const rm=(addedIds[sheet] && addedIds[sheet].has(String(id)))
      ? `<button class="rm-row" title="Remove this added row" onclick="removeAddedRow(${q(sheet)},${q(id)})">✕</button>` : "";
    return `<td data-k="${esc(c.k)}" class="ro mono${flag}"${tip}><div class="id-cell"><button class="icon-btn row-edit" title="Edit this row" onclick="openRowEditor(${q(sheet)},${q(id)})">✎</button><span>${esc(id)}</span>${rm}</div></td>`;
  };
  // A data row (+ inline assertion row when it has violations). Editable mode = read-only cells with a
  // ✎ button in the ID column that opens the edit dialog; non-editable (Entities) = inline cells.
  const bodyRow=(sheet,cols,r,editable)=>{
    const id=r[OV_ID[sheet]], viols=(val.byRow[sheet]||{})[id]||[];
    const sev=worstSeverity(viols)==="error"?"error":"warn";
    const cells=cols.map(c=> !editable ? cell(sheet,r,c) : (c.k===OV_ID[sheet] ? idCell(sheet,r,c) : roCell(sheet,r,c))).join("");
    const main=`<tr id="row-${esc(sheet)}-${esc(id)}" data-cols="${cols.length}">${cells}</tr>`;
    const vr=viols.length?`<tr id="viol-${esc(sheet)}-${esc(id)}" class="rowviol ${sev}"><td colspan="${cols.length}">${rowViolInner(viols)}</td></tr>`:"";
    return main+vr;
  };
  const tbl=(sheet,cols,data,empty,editable)=>`<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c.h)}</th>`).join("")}</tr></thead>
    <tbody>${data.length?data.map(r=>bodyRow(sheet,cols,r,editable)).join(""):`<tr><td colspan="${cols.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
  host.innerHTML = `<h3 style="margin:0 0 2px">${esc(sg.name)} <small class="hint">· FedGQL subgraph${focusNote} · <span class="hint">Entities cells are editable; use ✎ Edit on a Schema / Query / Mutation row</span></small></h3>
    ${standardsPanelHTML(val)}
    <div class="kv">Entities (${rows.Entities.length})</div>
    ${tbl("Entities",[{h:"EntityID",k:"EntityID",mono:1},{h:"Name",k:"Name",mono:1},{h:"Experience Domain",k:"ExperienceDomain",edit:1},{h:"Business Application",k:"BusinessApplication",edit:1},{h:"Service Type",k:"ServiceType",sel:["","Domain","Integration","Orchestrator"]},{h:"Business Capability",k:"BusinessCapability",edit:1},{h:"Comments",k:"Comments",edit:1,ta:1},{h:"Links & References",k:"Links",links:1},{h:"Approval",k:"ApprovalStatus",sel:APPROVALS}], rows.Entities, "no @key entities")}
    <div class="kv">Schema — types / enums / inputs (${rows.Schema.length}) <button class="addrow" onclick="addSubgraphRow('Schema')" data-help="mig-add-rows">＋ Add type</button></div>
    ${tbl("Schema",[{h:"SchemaID",k:"SchemaID",mono:1},{h:"Kind",k:"Kind",sel:["Key","Type","Input","Enum","Interface","Union","Scalar","Reference","Extend"]},{h:"Type name",k:"TypeName",mono:1,edit:1},{h:"Entity",k:"EntityID",mono:1},{h:"Definition",k:"Definition",mono:1,edit:1,ta:1},{h:"Description",k:"Description",edit:1,ta:1},{h:"Links & References",k:"Links",links:1},{h:"Approval",k:"ApprovalStatus",sel:APPROVALS}], rows.Schema, "no types", true)}
    <div class="kv">Queries (${rows.Queries.length}) <button class="addrow" onclick="addSubgraphRow('Queries')" data-help="mig-add-rows">＋ Add query</button></div>
    ${tbl("Queries",[{h:"QueryID",k:"QueryID",mono:1},{h:"Name",k:"Name",mono:1,edit:1},{h:"Parameters",k:"Parameters",mono:1,edit:1,ta:1},{h:"Return",k:"ReturnType",mono:1,edit:1},{h:"Entity",k:"EntityID",mono:1},{h:"Description",k:"Description",edit:1,ta:1},{h:"Links & References",k:"Links",links:1},{h:"Approval",k:"ApprovalStatus",sel:APPROVALS}], rows.Queries, "no queries", true)}
    <div class="kv">Mutations (${rows.Mutations.length}) <button class="addrow" onclick="addSubgraphRow('Mutations')" data-help="mig-add-rows">＋ Add mutation</button></div>
    ${tbl("Mutations",[{h:"MutationID",k:"MutationID",mono:1},{h:"Name",k:"Name",mono:1,edit:1},{h:"Parameters",k:"Parameters",mono:1,edit:1,ta:1},{h:"Return",k:"ReturnType",mono:1,edit:1},{h:"Entity",k:"EntityID",mono:1},{h:"Description",k:"Description",edit:1,ta:1},{h:"Links & References",k:"Links",links:1},{h:"Approval",k:"ApprovalStatus",sel:APPROVALS}], rows.Mutations, "no mutations", true)}
    <div class="kv">AuthScopes (0)</div>
    <div class="empty">Subgraphs don't define auth scopes — add these in the <b>GQL Registry</b> after copying.</div>`;
}
// Keep only rows the user has marked "Proposed" (each sheet), pulling in the owning Entities row of
// any proposed child so the copied set stays structurally complete.
function proposedRows(rows){
  const isProp=r=>String(r.ApprovalStatus||"").trim().toLowerCase()==="proposed";
  const out={ Entities:(rows.Entities||[]).filter(isProp), Schema:(rows.Schema||[]).filter(isProp),
    Queries:(rows.Queries||[]).filter(isProp), Mutations:(rows.Mutations||[]).filter(isProp) };
  const have=new Set(out.Entities.map(r=>String(r.EntityID||"")));
  const need=new Set();
  for(const s of ["Schema","Queries","Mutations"]) for(const r of out[s]) if(r.EntityID) need.add(String(r.EntityID));
  for(const e of (rows.Entities||[])){ const id=String(e.EntityID||""); if(need.has(id) && !have.has(id)){ out.Entities.push(e); have.add(id); } }
  return out;
}
function copyToRegistry(){
  const sg=migrationSubgraph();
  if(!sg){ alert("Pick the GQL Registry entity to migrate on the Load data tab first."); return; }
  const built=buildSubgraphRows(sg);
  if(!(built.Entities.length+built.Schema.length+built.Queries.length+built.Mutations.length)){ alert("This subgraph has no rows to copy yet."); return; }
  // Only Proposed rows are validated and copied — set a row's Approval to "Proposed" on this tab first.
  const rows=proposedRows(built);
  const total=rows.Entities.length+rows.Schema.length+rows.Queries.length+rows.Mutations.length;
  const proposedChildren=rows.Schema.length+rows.Queries.length+rows.Mutations.length;
  if(!proposedChildren){ alert('Nothing is marked "Proposed" yet.\n\nSet a row\'s Approval to "Proposed" on the FedGQL subgraph tab — only Proposed rows are validated and copied to the GQL Registry. New rows load as "Draft".'); document.querySelector('nav button[data-view="edit"]').click(); return; }
  const v=validateSubgraphRows(rows);
  if(v.errors.length){
    alert("The Proposed rows do not meet the FedGQL schema standards.\n\n"+v.errors.length+" error"+(v.errors.length>1?"s":"")+" must be fixed on the FedGQL subgraph tab before copying:\n\n"+summarizeViolations(v.errors)+"\n\nSee the highlighted cells and the issues panel on the FedGQL subgraph tab.");
    if(window.wzGo) wzGo(4);
    return;
  }
  if(v.warnings.length && !confirm(v.warnings.length+" FedGQL standards warning"+(v.warnings.length>1?"s":"")+" (copy is allowed, but review these):\n\n"+summarizeViolations(v.warnings)+"\n\nCopy to the GQL Registry anyway?")) { if(window.wzGo) wzGo(4); return; }
  if(!confirm("Make sure EntityIDs (ENT-XXX) in this migration match GQLRegistry.xlsx before continuing.\n\nProceed?")) return;
  const frame=document.getElementById("regFrame");
  if(!frame || !frame.contentWindow){ alert("GQL Registry isn't loaded yet — open the GQL Registry tab and retry."); return; }
  frame.contentWindow.postMessage({ type:"fedgql-merge", rows }, "*");
  toast("Copied "+total+" rows to GQL Registry");
  document.querySelector('nav button[data-view="registry"]')?.click();
}
// Ack from the embedded registry with exact merged counts.
window.addEventListener("message", e=>{
  const d=e.data; if(!d || d.type!=="fedgql-merged") return;
  const c=d.counts||{}; toast(`Registry merged: ${c.Entities||0} entities · ${c.Schema||0} types · ${c.Queries||0} queries · ${c.Mutations||0} mutations`);
});
