# Current REST API of the checkout / order service — migrates to subgraph.gql in this folder.
# POST /checkout already orchestrates cart → inventory → payments → clear cart server-side; after
# migration that logic lives in the submitCheckout resolver.
openapi: 3.0.3
info:
  title: Checkout & Orders API
  version: 3.0.0
  description: Places orders by orchestrating the cart, inventory and payments services.
servers:
  - url: https://checkout.retail.example.com/v3
security:
  - oauth2: []
paths:
  /checkout:
    post:
      operationId: submitCheckout
      security: [{ oauth2: ["checkout:write"] }]
      x-nfr: { latencyP95Ms: 1800, qps: 40, timeoutMs: 8000, availability: "99.95%", dataClass: "Confidential (PCI: payment method)" }
      # The downstream APIs this orchestrator calls today, in order (read by the code migration guide).
      x-orchestrates:
        - { service: cart, call: "GET /carts/{id}", op: cart }
        - { service: inventory, call: "GET /inventory/{sku}/stores/{storeId}", op: inventory }
        - { service: payments, call: "POST /payments", op: processPayment }
        - { service: cart, call: "DELETE /carts/{cartId}/items", op: clearCart }
      summary: Verify the cart and stock, create a pending order, take payment and clear the cart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitCheckoutInput" }
      responses:
        "200":
          description: Checkout result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }
  /orders/{id}:
    get:
      operationId: order
      security: [{ oauth2: ["orders:read"] }]
      x-nfr: { latencyP95Ms: 150, qps: 250, timeoutMs: 1500, cacheTtlS: 30 }
      summary: Fetch an order placed through checkout.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.retail.example.com/oauth/token
          scopes: { "cart:read": read carts, "cart:write": change carts, "checkout:write": place orders, "orders:read": read orders }
  schemas:
    SubmitCheckoutInput:
      type: object
      required: [cartId, paymentMethodId, shippingAddress]
      properties:
        cartId: { type: string }
        paymentMethodId: { type: string }
        shippingAddress: { type: string }
    CheckoutResult:
      type: object
      required: [success, errors]
      properties:
        success: { type: boolean }
        order: { $ref: "#/components/schemas/Order" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/CheckoutError" }
    Order:
      type: object
      required: [id, status, totalPaid]
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, PLACED, FAILED, UNKNOWN] }
        totalPaid: { type: number }
        paymentTransactionId: { type: string }
    CheckoutError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
