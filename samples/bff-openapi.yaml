# Sample monolithic BFF (backend-for-frontend) REST API — the composite endpoints to migrate.
# Each endpoint today fans out to several services by hand; after migration it becomes ONE
# federated query/mutation across the product, pnp, inventory, search, cart, payments and checkout
# subgraphs.
# Load it on subgraph-codemigration.html as the "REST spec", switch Mode → "BFF composite",
# and map each endpoint to the FedGQL operations it composes:
#   GET  /bff/search                          → searchProducts (+ Product / storeContext hydration)
#   GET  /bff/product-detail/{sku}            → product + Product.storeContext (+ inventoryCount)
#   GET  /bff/product-detail/{sku}/stores     → product + Product.allStoreContexts
#   PUT  /bff/admin/prices/{sku}/stores/{id}  → updateStorePrice
#   POST /bff/admin/inventory/adjustments     → adjustInventory
#   GET    /bff/cart/{cartId}                 → cart (router hydrates each line's Product by sku)
#   POST   /bff/cart/{cartId}/items           → addItemToCart
#   DELETE /bff/cart/{cartId}/items/{sku}     → removeItemFromCart
#   POST   /bff/checkout                      → submitCheckout — the ORCHESTRATING mutation; add
#                                               cart, inventory, processPayment, clearCart as its steps
#   GET    /bff/orders/{orderId}              → order (confirmation page)
openapi: 3.0.3
info:
  title: Retail Web BFF (monolithic)
  version: 2.1.0
  description: Web storefront BFF that aggregates the search, product, pricing, inventory, cart, payments and checkout services.
servers:
  - url: https://bff.retail.example.com
paths:
  /bff/search:
    get:
      operationId: searchAndCheckStorePrices
      summary: Search results page — hits hydrated with title/brand (product) and store price + stock (pnp, inventory).
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: storeId, in: query, required: true, schema: { type: string } }
        - { name: brand, in: query, required: false, schema: { type: array, items: { type: string } } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Search page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
  /bff/product-detail/{sku}:
    get:
      operationId: getProductDetail
      summary: Product detail page — product attributes + price and stock at the selected store.
      parameters:
        - { name: sku, in: path, required: true, schema: { type: string } }
        - { name: storeId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
  /bff/product-detail/{sku}/stores:
    get:
      operationId: getProductStoreComparison
      summary: Compare price and stock for a product across all stores.
      parameters:
        - { name: sku, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product with per-store price and stock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductStoreComparison" }
  /bff/admin/prices/{sku}/stores/{storeId}:
    put:
      operationId: setStorePrice
      summary: Admin — set the price of a SKU at a store.
      parameters:
        - { name: sku, in: path, required: true, schema: { type: string } }
        - { name: storeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetStorePriceRequest" }
      responses:
        "200":
          description: Updated store price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreOffer" }
  /bff/admin/inventory/adjustments:
    post:
      operationId: postInventoryAdjustment
      summary: Admin — apply a stock adjustment at a store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryAdjustmentRequest" }
      responses:
        "200":
          description: Updated stock position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockPosition" }
  /bff/cart/{cartId}:
    get:
      operationId: getCartPage
      summary: Cart page — lines with product title and brand (product) and line prices (cart).
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cart page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartPage" }
  /bff/cart/{cartId}/items:
    post:
      operationId: addToCart
      summary: Add a SKU to the cart and return the refreshed cart page.
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddToCartRequest" }
      responses:
        "200":
          description: Updated cart page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartPage" }
  /bff/cart/{cartId}/items/{sku}:
    delete:
      operationId: removeFromCart
      summary: Remove a SKU from the cart and return the refreshed cart page.
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - { name: sku, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated cart page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartPage" }
  /bff/checkout:
    post:
      operationId: placeOrder
      summary: Checkout — today the BFF calls cart, inventory, payments and cart again in sequence; after migration it sends one submitCheckout mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
      responses:
        "200":
          description: Checkout outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceOrderResponse" }
  /bff/orders/{orderId}:
    get:
      operationId: getOrderConfirmation
      summary: Order confirmation page.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Order confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderConfirmation" }
components:
  schemas:
    SearchPage:
      type: object
      required: [totalCount, hits]
      properties:
        totalCount: { type: integer }
        hits:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        facets:
          type: array
          items: { $ref: "#/components/schemas/Facet" }
    SearchHit:
      type: object
      required: [sku]
      properties:
        sku: { type: string }
        title: { type: string }
        brand: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        inventoryCount: { type: integer }
    Facet:
      type: object
      properties:
        field: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              count: { type: integer }
    ProductDetail:
      type: object
      required: [sku, title]
      properties:
        sku: { type: string }
        title: { type: string }
        description: { type: string }
        imageUrl: { type: string, format: uri }
        brand: { type: string }
        storeOffer: { $ref: "#/components/schemas/StoreOffer" }
    ProductStoreComparison:
      type: object
      required: [sku]
      properties:
        sku: { type: string }
        title: { type: string }
        stores:
          type: array
          items: { $ref: "#/components/schemas/StoreOffer" }
    StoreOffer:
      type: object
      required: [storeId]
      properties:
        storeId: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        inventoryCount: { type: integer }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string }
    SetStorePriceRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string }
    InventoryAdjustmentRequest:
      type: object
      required: [sku, storeId, delta]
      properties:
        sku: { type: string }
        storeId: { type: string }
        delta: { type: integer }
        reason: { type: string }
    StockPosition:
      type: object
      properties:
        sku: { type: string }
        storeId: { type: string }
        onHand: { type: integer }
        availableToSell: { type: integer }
    CartPage:
      type: object
      required: [cartId, lines]
      properties:
        cartId: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
        totalAmount: { $ref: "#/components/schemas/Money" }
    CartLine:
      type: object
      properties:
        sku: { type: string }
        title: { type: string }
        brand: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: "#/components/schemas/Money" }
    AddToCartRequest:
      type: object
      required: [sku, quantity]
      properties:
        sku: { type: string }
        quantity: { type: integer }
    PlaceOrderRequest:
      type: object
      required: [cartId, paymentMethodId, shippingAddress]
      properties:
        cartId: { type: string }
        paymentMethodId: { type: string }
        shippingAddress: { type: string }
    PlaceOrderResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        orderId: { type: string }
        status: { type: string, enum: [PENDING, PLACED, FAILED] }
        totalPaid: { $ref: "#/components/schemas/Money" }
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
    OrderConfirmation:
      type: object
      properties:
        orderId: { type: string }
        status: { type: string }
        totalPaid: { $ref: "#/components/schemas/Money" }
        paymentStatus: { type: string }
