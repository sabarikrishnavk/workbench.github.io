# Sample MonoGraph (monolithic "monograph") schema — the source SDL to migrate FROM.
# Load it on gql-migration.html → MonoGraph schema tab. Everything lives in one graph today;
# the target splits it into the product, pnp, inventory, search, cart, payments and checkout subgraphs
# (see samples/subgraph/*/subgraph.gql and the "Load example" registry).

scalar Money

"""Merchandising product master data plus store-scoped price and stock (to be split)."""
type Product {
  sku: String!
  title: String!
  description: String
  imageUrl: String
  brand: String
  storeContext(storeId: ID!): ProductStoreContext
  allStoreContexts: [ProductStoreContext!]!
}

"""A product at a specific physical store — price and stock resolved in one place today."""
type ProductStoreContext {
  sku: String!
  storeId: ID!
  price: Price!
  inventoryCount: Int!
}

type Price {
  amount: Money!
  currency: String!
}

type Inventory {
  sku: String!
  storeId: ID!
  onHand: Int!
  reserved: Int!
  availableToSell: Int!
}

type SearchResponse {
  hits: [Product!]!
  totalCount: Int!
  facets: [SearchFacet!]!
}

type SearchFacet {
  field: String!
  options: [FacetOption!]!
}

type FacetOption {
  value: String!
  count: Int!
}

type Cart {
  id: ID!
  userId: ID
  items: [CartItem!]!
  totalAmount: Money!
}

type CartItem {
  id: ID!
  quantity: Int!
  product: Product!
  unitPrice: Money!
}

enum OrderStatus {
  PENDING
  PLACED
  FAILED
  UNKNOWN
}

enum PaymentStatus {
  SUCCESS
  FAILED
  DECLINED
  UNKNOWN
}

"""Order and payment live together in the monolith (to be split into checkout + payments)."""
type Order {
  id: ID!
  status: OrderStatus!
  totalPaid: Money!
  paymentStatus: PaymentStatus!
  gatewayReference: String
}

type CheckoutError {
  code: String!
  message: String!
}

type CheckoutResult {
  success: Boolean!
  order: Order
  errors: [CheckoutError!]!
}

input AddItemToCartInput {
  cartId: ID!
  sku: String!
  quantity: Int!
}

input SubmitCheckoutInput {
  cartId: ID!
  paymentMethodId: String!
  shippingAddress: String!
}

input ProductFilterInput {
  brand: [String!]!
  inStockAtStore: ID
}

input UpdateStorePriceInput {
  sku: String!
  storeId: ID!
  amount: Money!
  currency: String!
}

input InventoryAdjustmentInput {
  sku: String!
  storeId: ID!
  delta: Int!
  reason: String
}

type Query {
  """Fetch a product by SKU."""
  product(sku: String!): Product
  """Batch-fetch products by SKU."""
  products(skus: [String!]!): [Product!]!
  """Store-scoped price and stock for a SKU."""
  productStoreContext(sku: String!, storeId: ID!): ProductStoreContext
  """Stock position of a SKU at a store."""
  inventory(sku: String!, storeId: ID!): Inventory
  """Full-text product search."""
  searchProducts(query: String!, filters: ProductFilterInput, limit: Int, offset: Int): SearchResponse!
  """Fetch a cart with its lines."""
  cart(id: ID!): Cart
  """Fetch an order."""
  order(id: ID!): Order
}

type Mutation {
  """Set the price of a SKU at a store."""
  updateStorePrice(input: UpdateStorePriceInput!): ProductStoreContext
  """Apply a stock adjustment (delta) at a store."""
  adjustInventory(input: InventoryAdjustmentInput!): Inventory
  """Add a SKU to the cart."""
  addItemToCart(input: AddItemToCartInput!): Cart!
  """Check out: validate, charge and place the order — all inside the monolith today."""
  submitCheckout(input: SubmitCheckoutInput!): CheckoutResult!
}
